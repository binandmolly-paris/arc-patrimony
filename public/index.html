    function renderTab0() {
        const container = document.getElementById('tab-0');

        // === Active holdings: market value + book cost (USD) ===
        const activeHoldings = APP.holdings.filter(h => h.qty > 0);
        const totalValue = activeHoldings.reduce((sum, h) => {
            const price = APP.prices[h.symbol]?.price || h.avg_cost;
            return sum + (h.qty * price * (APP.FX_RATES[h.currency] || 1));
        }, 0);
        const totalCost = activeHoldings.reduce((sum, h) => {
            return sum + (h.qty * h.avg_cost * (APP.FX_RATES[h.currency] || 1));
        }, 0);
        const unrealizedPL = totalValue - totalCost;

        // === Realized + Dividends across ALL holdings (incl. closed positions) ===
        const allHoldings = APP.holdings;
        const realizedPL_USD = allHoldings.reduce((s, h) => s + (h.realized_pl || 0) * (APP.FX_RATES[h.currency] || 1), 0);
        const dividends_USD = allHoldings.reduce((s, h) => s + (h.dividend_total || 0) * (APP.FX_RATES[h.currency] || 1), 0);
        const realizedCost_USD = allHoldings.reduce((s, h) => s + (h.realized_cost || 0) * (APP.FX_RATES[h.currency] || 1), 0);

        // === Cumulative Return (since inception) — INCLUDES realized PL + dividends ===
        const cumulativePL = unrealizedPL + realizedPL_USD + dividends_USD;
        // Denominator: total cost basis ever invested = active book + sold cost basis
        const totalInvestedEver = totalCost + realizedCost_USD;
        const cumulativeReturnPct = totalInvestedEver > 0 ? (cumulativePL / totalInvestedEver * 100) : 0;

        // Average cost per share (portfolio-level, USD): weighted avg
        const totalShares = activeHoldings.reduce((s, h) => s + h.qty, 0);
        const portfolioAvgCostUSD = totalShares > 0 ? (totalCost / totalShares) : 0;

        // === YTD totals — 使用锚定价精确计算（各市场本地年初）===
        // 公式：YTD = (今市值 + 本年卖出 + 本年分红) − (锚定持仓价值 + 本年买入)
        // 没锚定价的股票走 fallback：本年新开仓位算全额浮盈亏
        const yearStart = `${new Date().getFullYear()}-01-01`;
        const anchorPrices = APP.anchorPrices || {};
        let hasAnchorMode = false; // 至少有一只股有锚定价

        // 统计本年所有交易（已实现 + 分红 + 买入金额）
        const ytdBuyBySymbol = {};   // 本年买入累计 qty 和 金额（本币）
        const ytdSellBySymbol = {};  // 本年卖出累计 qty 和 金额（本币）
        const ytdDivBySymbol = {};   // 本年分红累计金额（本币）
        APP.trades.filter(t => t.date >= yearStart).forEach(t => {
            const isBuy = t.type === '买入' || t.type === 'BUY';
            const isDiv = t.type === '分红' || t.type === 'DIVIDEND';
            const isSell = t.type === '卖出' || t.type === 'SELL';
            if (isBuy) {
                if (!ytdBuyBySymbol[t.symbol]) ytdBuyBySymbol[t.symbol] = { qty: 0, amount: 0 };
                ytdBuyBySymbol[t.symbol].qty += t.qty;
                ytdBuyBySymbol[t.symbol].amount += t.qty * t.price;
            } else if (isSell) {
                if (!ytdSellBySymbol[t.symbol]) ytdSellBySymbol[t.symbol] = { qty: 0, amount: 0 };
                ytdSellBySymbol[t.symbol].qty += t.qty;
                ytdSellBySymbol[t.symbol].amount += t.qty * t.price;
            } else if (isDiv) {
                ytdDivBySymbol[t.symbol] = (ytdDivBySymbol[t.symbol] || 0) + t.qty * t.price;
            }
        });

        // 第一次买入日期（用于 fallback）
        const firstBuyDateBySymbol = {};
        APP.trades.forEach(t => {
            const isBuy = t.type === '买入' || t.type === 'BUY';
            if (!isBuy) return;
            if (!firstBuyDateBySymbol[t.symbol] || t.date < firstBuyDateBySymbol[t.symbol]) {
                firstBuyDateBySymbol[t.symbol] = t.date;
            }
        });

        // 收集所有涉及到的 symbol（活跃 + 本年有交易的）
        const ytdSymbols = new Set([
            ...activeHoldings.map(h => h.symbol),
            ...Object.keys(ytdBuyBySymbol),
            ...Object.keys(ytdSellBySymbol),
            ...Object.keys(ytdDivBySymbol),
        ]);

        let ytdUnrealized = 0, ytdRealized = 0, ytdDividends = 0, ytdInvested = 0;
        const ytdByRegion = {};  // 按区域累加 YTD 总盈亏 (USD)，用于卡片国旗细分

        ytdSymbols.forEach(sym => {
            const h = APP.holdings.find(x => x.symbol === sym);
            if (!h) return;
            const r = h.region || '其他';
            const fx = APP.FX_RATES[h.currency] || 1;
            const anchor = anchorPrices[sym];
            const buy = ytdBuyBySymbol[sym] || { qty: 0, amount: 0 };
            const sell = ytdSellBySymbol[sym] || { qty: 0, amount: 0 };
            const div = ytdDivBySymbol[sym] || 0;
            const currentPrice = APP.prices[sym]?.price || h.avg_cost;
            const currentQty = h.qty;

            // YTD invested 用本年实际买入额作为分母参考
            ytdInvested += buy.amount * fx;

            // 分红总是计入
            const divUSD = div * fx;
            ytdDividends += divUSD;

            // 单只股票本年浮盈亏 / 已实现 (USD)，用于按 region 累加
            let stockYtdUnrealUSD = 0, stockYtdRealUSD = 0;

            if (anchor && anchor.close_price > 0) {
                // ✅ 精确模式：用锚定价
                hasAnchorMode = true;
                // 年初持仓数 = 当前持仓 - 本年买入 + 本年卖出
                const anchorQty = currentQty - buy.qty + sell.qty;
                const anchorValue = Math.max(0, anchorQty) * anchor.close_price;
                const todayMV = currentQty * currentPrice;
                // YTD per stock = (今市值 + 本年卖出 + 本年分红) − (锚定持仓价值 + 本年买入)
                const ytdLocal = (todayMV + sell.amount) - (anchorValue + buy.amount);
                // 拆分浮盈亏 vs 已实现：浮盈亏 = (current - anchor) * 当前持仓
                const unrealLocal = currentQty > 0 ? (currentPrice - anchor.close_price) * currentQty : 0;
                const realLocal = ytdLocal - unrealLocal;
                stockYtdUnrealUSD = unrealLocal * fx;
                stockYtdRealUSD   = realLocal   * fx;
            } else {
                // ⚠️ Fallback：没锚定价 → 本年新开仓位算全额浮盈亏；老仓位浮盈亏算 0
                const firstBuy = firstBuyDateBySymbol[sym];
                if (firstBuy && firstBuy >= yearStart) {
                    if (currentQty > 0) {
                        stockYtdUnrealUSD = (currentPrice - h.avg_cost) * currentQty * fx;
                    }
                }
                // 本年卖出，已实现按 avg_cost 算
                if (sell.qty > 0) {
                    stockYtdRealUSD = (sell.amount - h.avg_cost * sell.qty) * fx;
                }
            }

            ytdUnrealized += stockYtdUnrealUSD;
            ytdRealized   += stockYtdRealUSD;

                regionGrouped[key] = (regionGrouped[key]||0) + h.qty * p * rate;
                regionCosts[key] = (regionCosts[key]||0) + h.qty * h.avg_cost * rate;
            });
            const regionTotal = Object.values(regionGrouped).reduce((a,b) => a+b, 0);
            const regionData = Object.entries(regionGrouped).sort((a,b) => b[1]-a[1]).map(([label, value]) => {
                const cost = regionCosts[label] || 0;
                const pl = value - cost;
                const plPct = cost > 0 ? (pl / cost * 100) : 0;
                return {
                    label, value, pct: regionTotal > 0 ? (value/regionTotal*100) : 0,
                    color: regionColors[label] || fallbackColor,
                    flag: regionFlags[label] || '🌐',
                    pl, plPct
                };
            });

            // Build SVG orbital ring (large, bold, dominant)
            const R = 105, SW = 30, CX = 120, CY = 120;
            const circumference = 2 * Math.PI * R;
            const gapDeg = 5;
            const totalGapDeg = gapDeg * regionData.length;
            const availableDeg = 360 - totalGapDeg;
            let rotateOffset = -90;

            let ringSegments = '';
            let ringLabels = '';
            const regionAbbr = {'美国':'US','中国':'CN','日本':'JP','香港':'HK'};
            regionData.forEach((d, i) => {
                const segDeg = (d.value / regionTotal) * availableDeg;
                const segLen = (segDeg / 360) * circumference;
                const dasharray = segLen + ' ' + (circumference - segLen);
                const dashoffset = -(rotateOffset / 360) * circumference;
                ringSegments += '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+d.color+'" stroke-width="'+SW+'" stroke-dasharray="'+dasharray+'" stroke-dashoffset="'+dashoffset+'" stroke-linecap="round" style="filter:drop-shadow(0 0 12px '+d.color+'50);transform-origin:center;opacity:0;animation:ringFadeIn 0.8s ease '+(0.2+i*0.15)+'s forwards;"/>';
                // Place country abbreviation at midpoint of arc
                const midDeg = rotateOffset + segDeg / 2;
                const midRad = midDeg * Math.PI / 180;
                const lx = CX + R * Math.cos(midRad);
                const ly = CY + R * Math.sin(midRad);
                const abbr = regionAbbr[d.label] || d.label.substring(0,2);
                ringLabels += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="10" font-weight="700" font-family="Montserrat,sans-serif" style="text-shadow:0 1px 3px rgba(0,0,0,0.6);">'+abbr+'</text>';
                rotateOffset += segDeg + gapDeg;
            });

            // Legend: compact left side, color bar between region name and percentage
            let legendList = '';
            regionData.forEach((d, i) => {
                const plClass = d.plPct >= 0 ? 'price-positive' : 'price-negative';
                const isLast = i === regionData.length - 1;
                legendList += '<div style="display:flex;align-items:center;gap:0;padding:8px 0;'+(isLast?'':'border-bottom:1px solid rgba(193,166,115,0.08);')+'">'
                    + '<div style="display:flex;align-items:center;gap:6px;min-width:0;">'
                    + '<span style="font-size:14px;flex-shrink:0;">'+d.flag+'</span>'
                    + '<div>'
                    + '<div style="color:#e2e8f0;font-size:12px;font-weight:600;font-family:Montserrat,sans-serif;">'+d.label+'</div>'
                    + '<div style="color:#64748b;font-size:9px;font-family:Montserrat,sans-serif;margin-top:1px;">$'+fmtNum(d.value)+'</div>'
                    + '</div></div>'
                    + '<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px;">'
                    + '<div style="width:100%;height:3px;border-radius:2px;background:'+d.color+'40;position:relative;">'
                    + '<div style="width:'+Math.max(d.pct,5)+'%;height:100%;border-radius:2px;background:'+d.color+';box-shadow:0 0 6px '+d.color+'60;"></div>'
                    + '</div></div>'
                    + '<div style="text-align:right;flex-shrink:0;min-width:60px;">'
                    + '<div style="color:'+d.color+';font-size:15px;font-weight:700;font-family:Montserrat,sans-serif;">'+fmtNum(d.pct,1)+'%</div>'
                    + '<div class="'+plClass+'" style="font-size:9px;font-weight:600;font-family:Montserrat,sans-serif;margin-top:1px;">P&L '+formatPercent(d.plPct)+'</div>'
                    + '</div></div>';
            });

            const regionViz = document.getElementById('region-viz');
            if (regionViz) {
                regionViz.innerHTML = '<style>@keyframes ringFadeIn{from{opacity:0;transform:scale(0.85);}to{opacity:1;transform:scale(1);}}</style>'
                    + '<div style="min-width:110px;max-width:200px;display:flex;flex-direction:column;justify-content:center;margin-left:auto;padding-right:16px;">'+legendList+'</div>'
                    + '<div style="flex-shrink:0;display:flex;align-items:center;justify-content:center;">'
                    + '<svg viewBox="0 0 240 240" style="width:100%;max-width:300px;height:auto;overflow:visible;">'
                    + '<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="rgba(193,166,115,0.04)" stroke-width="'+SW+'"/>'
                    + ringSegments
                    + ringLabels
                    + '<text x="'+CX+'" y="'+(CY-10)+'" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700" font-family="Montserrat,sans-serif">$'+fmtNum(regionTotal)+'</text>'
                    + '<text x="'+CX+'" y="'+(CY+8)+'" text-anchor="middle" fill="#64748b" font-size="8" letter-spacing="2" font-family="Montserrat,sans-serif">TOTAL VALUE</text>'
                    + '</svg></div>';
            }

            // Today's Movers by Region - bordered blocks with arrow icons
            const moversViz = document.getElementById('movers-viz');
            if (moversViz) {
                const regions = [...new Set(activeHoldings.map(h => h.region).filter(Boolean))];

    function renderTab4() {
        const container = document.getElementById('tab-4');
        if (APP.holdings.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">No data to analyze</div></div>`;
            return;
        }

        const st = APP.analysisState;
        const regions = ['全部', ...new Set(APP.holdings.map(h => h.region).filter(Boolean))];
        const currencies = ['全部', ...new Set(APP.holdings.map(h => h.currency).filter(Boolean))];

        // Build enriched data
        let allData = APP.holdings.map(h => {
            const currentPrice = APP.prices[h.symbol]?.price || h.avg_cost;
            const priceChange = APP.prices[h.symbol]?.change || 0;
            const rate = APP.FX_RATES[h.currency] || 1;
            const isSold = h.qty <= 0;
            const marketValueLocal = isSold ? 0 : h.qty * currentPrice;
            const costLocal = isSold ? 0 : h.qty * h.avg_cost;
            const plLocal = isSold ? (h.realized_pl || 0) : marketValueLocal - costLocal;
            const marketValueUSD = isSold ? 0 : marketValueLocal * rate;
            const costUSD = isSold ? 0 : costLocal * rate;
            const plUSD = isSold ? (h.realized_pl || 0) * rate : marketValueUSD - costUSD;
            const plPct = isSold ? (h.realized_cost > 0 ? (h.realized_pl / h.realized_cost * 100) : 0) : (costUSD > 0 ? (plUSD / costUSD * 100) : 0);
            // Cycle avg cost (per share, in local currency):
            //   = avg_cost − (已实现盈亏 + 分红) / 当前持仓
            // realized_pl & dividend_total from server are in local currency
            const realizedLocal = h.realized_pl || 0;
            const dividendLocal = h.dividend_total || 0;
            const cycleCostLocal = (!isSold && h.qty > 0)
                ? h.avg_cost - (realizedLocal + dividendLocal) / h.qty
                : h.avg_cost;
            const cycleReturnPct = cycleCostLocal > 0 && !isSold
                ? ((currentPrice - cycleCostLocal) / cycleCostLocal * 100)
                : 0;
            return { ...h, currentPrice, priceChange, marketValueLocal, costLocal, plLocal, marketValueUSD, costUSD, plUSD, plPct, isSold, cycleCostLocal, cycleReturnPct };
        });
        let data = allData.filter(d => !d.isSold);

    function toggleAnalysisSort(key) {
        const st = APP.analysisState;

    function setAnalysisFilter(type, val) {

        else APP.analysisState.currencyFilter = val;
        renderTab4();
    }

    function copyAnalysisTable() {
        const table = document.getElementById('analysisTable');
        if (!table) return;
        let tsv = '';
        const rows = table.querySelectorAll('tr');
        rows.forEach(row => {
            const cells = row.querySelectorAll('th, td');
            const vals = [];
            cells.forEach(c => vals.push(c.innerText.replace(/\t/g, ' ').replace(/\n/g, ' ')));
            tsv += vals.join('\t') + '\n';
        });
        navigator.clipboard.writeText(tsv).then(() => {
            alert('Table copied to clipboard! You can paste it directly into Excel');
        }).catch(() => {
            // Fallback
            const ta = document.createElement('textarea');
            ta.value = tsv; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy');
            document.body.removeChild(ta);
            alert('Table copied to clipboard!');
        });
    }

    // ===== 股票详情弹窗 =====
    function showStockDetail(symbol) {
        const holding = APP.holdings.find(h => h.symbol === symbol);
        if (!holding) return;
        const trades = APP.trades.filter(t => t.symbol === symbol).sort((a, b) => new Date(a.date) - new Date(b.date));
        if (trades.length === 0) { alert('No trades found for this stock'); return; }

        const rate = APP.FX_RATES[holding.currency] || 1;
        const curSym = holding.currency==='CNY'?'¥':holding.currency==='JPY'?'¥':holding.currency==='HKD'?'HK$':'$';
        const isSold = holding.qty <= 0;
        const currentPrice = APP.prices[symbol]?.price || holding.avg_cost;

        // Calculate running position
        let runQty = 0, totalBuyCost = 0, totalBuyQty = 0;
        let totalSellRevenue = 0, totalSellQty = 0, totalDividend = 0;
        const timeline = trades.map(t => {
            const isBuy = t.type === '买入' || t.type === 'BUY';
            const isDividend = t.type === '分红' || t.type === 'DIVIDEND';
            if (isBuy) {
                runQty += t.qty;
                totalBuyCost += t.qty * t.price;
                totalBuyQty += t.qty;
            } else if (isDividend) {
                totalDividend += t.qty * t.price;
            } else {
                runQty -= t.qty;
                totalSellRevenue += t.qty * t.price;
                totalSellQty += t.qty;
            }
            return { ...t, runQty: Math.max(0, runQty) };
        });

        const avgBuyCost = totalBuyQty > 0 ? totalBuyCost / totalBuyQty : 0;
        const currentMV = holding.qty * currentPrice;
        const unrealizedPL = isSold ? 0 : currentMV - (holding.qty * avgBuyCost);
        const realizedPL = totalSellQty > 0 ? totalSellRevenue - (totalSellQty * avgBuyCost) : 0;
        const totalPL = unrealizedPL + realizedPL + totalDividend;
        const totalInvested = totalBuyCost;
        const totalReturn = totalInvested > 0 ? (totalPL / totalInvested * 100) : 0;

        // ===== 周期平均成本（Cycle Avg Cost）=====
        // 把已实现盈亏 + 分红收入当作"成本回收"，反算出当前每股的有效净成本
        // 公式: cycleAvgCost = (总投入 - 卖出回收 - 分红) / 当前持仓
        //                   = avgBuyCost - (已实现盈亏 + 分红) / 当前持仓
        const cycleNetCash = totalBuyCost - totalSellRevenue - totalDividend;
        const cycleAvgCost = (!isSold && holding.qty > 0)
            ? cycleNetCash / holding.qty
            : 0;
        const costSavingPerShare = avgBuyCost - cycleAvgCost; // >0 表示成本被摊低
        const costSavingPct = avgBuyCost > 0 ? (costSavingPerShare / avgBuyCost * 100) : 0;
        // 周期收益率: 当前价相对周期成本的百分比
        const cycleReturnPct = cycleAvgCost > 0 ? ((currentPrice - cycleAvgCost) / cycleAvgCost * 100) : 0;

                ${!isSold && holding.qty > 0 ? `

    // ===== Phase 2: 基本面 Fundamentals =====
    // FMP 的 ROE / ROIC / 利润率 / 股息率 / 派息率 等字段总是 decimal 形式
    // (0.15 = 15%, 1.5 = 150% 表示苹果这种回购大户)，无脑 × 100 即可
    // 注意：day_change_pct 不能用此函数（FMP 那个字段已经是百分数形式）
    function pctSmart(v) {
        if (v == null) return null;
        const n = parseFloat(v);
        if (isNaN(n)) return null;
        return (n * 100).toFixed(2) + '%';
    }

    function fmtMarketCap(n, currency) {
        if (n == null) return null;
        const v = parseFloat(n);
        if (isNaN(v) || v === 0) return null;
        const sym = currency === 'CNY' || currency === 'JPY' ? '¥'
                  : currency === 'HKD' ? 'HK$'
                  : '$';
        const abs = Math.abs(v);
        if (abs >= 1e12) return sym + (v / 1e12).toFixed(2) + 'T';
        if (abs >= 1e9) return sym + (v / 1e9).toFixed(2) + 'B';
        if (abs >= 1e6) return sym + (v / 1e6).toFixed(1) + 'M';
        return sym + v.toLocaleString();
    }

    // Phase 2.3 + Phase 3: 来源徽章渲染
    // Y = Yahoo / F = FMP / T = Tushare（A股/港股）/ J = J-Quants（日股）/ ⚠ = 双源分歧
    function renderSourceBadge(field, fieldSources, discrepancies) {
        const src = fieldSources && fieldSources[field];
        if (!src) return '';
        const disc = discrepancies && discrepancies[field];
        const SRC_META = {
            yahoo:     { letter: 'Y', name: 'Yahoo Finance',           color: '#94a3b8', bg: 'rgba(148,163,184,0.10)' },
            fmp:       { letter: 'F', name: 'FMP',                      color: '#94a3b8', bg: 'rgba(148,163,184,0.10)' },
            tushare:   { letter: 'T', name: 'Tushare Pro (A股)',        color: '#f87171', bg: 'rgba(248,113,113,0.12)' },
            jquants:   { letter: 'J', name: 'J-Quants V2 (日股)',        color: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },
            eastmoney: { letter: 'E', name: '东方财富 Eastmoney (港股)', color: '#fb923c', bg: 'rgba(251,146,60,0.12)' },
        };

        if (disc) {

            return `<span style="${baseStyle}background:rgba(251,191,36,0.18);color:#fbbf24;border:1px solid rgba(251,191,36,0.4);" title="${tooltip}">${meta.letter}⚠</span>`;
        }
        return `<span style="${baseStyle}background:${meta.bg};color:${meta.color};" title="数据源：${meta.name}">${meta.letter}</span>`;

    // Phase 3 多源刷新（按市场路由：US→Yahoo+FMP，A股/港股→Tushare，日股→J-Quants V2）
    async function refreshAllFundamentals() {
        const count = APP.holdings.filter(h => h.qty > 0).length;
        // 估算耗时：港股 hk_daily 限速 31s/只 是大头
        const hkCount = APP.holdings.filter(h => h.qty > 0 && h.symbol.endsWith('.HK')).length;
        const estSec = Math.max(Math.ceil(count * 2), hkCount * 31);
        if (!confirm(`即将按市场分源批量拉取 ${count} 只持仓的基本面：\n· 美股 → Yahoo + FMP 双源\n· A股 → Tushare Pro\n· 港股 → 东方财富 (Phase 3.5)\n· 日股 → J-Quants V2\n\n预计约 ${estSec} 秒。\n\n继续？`)) return;
        try {
            const result = await apiCall('/fundamentals/refresh-all', 'POST');
            const failedMsg = result.failed && result.failed.length > 0
                ? `\n\n失败 ${result.failed.length} 只：\n${result.failed.slice(0, 8).map(f => `· ${f.symbol}`).join('\n')}${result.failed.length > 8 ? `\n…还有 ${result.failed.length - 8} 只` : ''}`
                : '';
            const srcs = result.sources || {};
            // 按非零项展示来源分布；Phase 3 加 Tushare/J-Quants/Eastmoney
            const srcLabels = {
                'yahoo+fmp': '双源 Y+F', yahoo: '仅 Yahoo', fmp: '仅 FMP',
                tushare: 'Tushare 🇨🇳A', jquants: 'J-Quants 🇯🇵', eastmoney: '东方财富 🇭🇰', 'tushare+fmp': 'Tushare+FMP',
            };
            const srcParts = Object.entries(srcLabels)
                .map(([k, label]) => srcs[k] > 0 ? `${label} ${srcs[k]}` : null)
                .filter(Boolean);
            const srcMsg = srcParts.length > 0 ? `\n\n📊 来源分布：${srcParts.join(' · ')}` : '';
            const discMsg = result.total_discrepancies > 0
                ? `\n⚠ 发现 ${result.total_discrepancies} 处双源分歧（点击股票详情看 ⚠ 标记）`
                : (result.ok > 0 && (srcs['yahoo+fmp']||0) > 0 ? '\n✓ 美股双源字段均吻合' : '');
            const errMsg = result.first_error
                ? `\n\n🔍 首个失败具体原因：\n${result.first_error}`
                : '';
            alert(`已刷新 ${result.ok}/${result.total} 只股票${srcMsg}${discMsg}${errMsg}${failedMsg}`);
        } catch (e) {
            alert(`❌ 刷新失败：${e.message}`);
        }
    }

    // ===== 投资组合 Tab =====
    // Format budget value with thousand separators for display in input
    function fmtBudgetInput(val) {
        const n = parseFloat(val) || 0;
        if (n === 0) return '';
        return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
    }
    // Parse budget input (strip commas/spaces) back to number
    function parseBudgetInput(str) {
        return parseFloat(String(str).replace(/[,\s]/g, '')) || 0;
    }

    // Region → primary local currency mapping
    function getRegionCurrency(region) {
        const map = {'中国':'CNY','日本':'JPY','美国':'USD','香港':'HKD'};
        return map[region] || 'USD';
    }

    // FX strip: USD/CNY, USD/JPY, USD/CHF, USD/MYR, CNY/HKD
    function _fxPair(base, quote) {
        const fx = APP.FX_RATES;
        const baseUSD = base === 'USD' ? 1 : (fx[base] || 0);
        const quoteUSD = quote === 'USD' ? 1 : (fx[quote] || 0);
        if (!baseUSD || !quoteUSD) return null;
        const rate = baseUSD / quoteUSD;
        const baseUSDp = base === 'USD' ? 1 : (fx['_prev_' + base] || baseUSD);
        const quoteUSDp = quote === 'USD' ? 1 : (fx['_prev_' + quote] || quoteUSD);
        const prev = baseUSDp / quoteUSDp;
        const chg = prev > 0 ? (rate - prev) / prev * 100 : 0;
        return { rate, prev, chg };
    }
    function _fmtFXRate(r) {
        if (r >= 100) return r.toFixed(2);
        if (r >= 10) return r.toFixed(3);
        return r.toFixed(4);
    }
    function renderFXStrip() {
        const pairs = [
            ['USD','CNY'], ['USD','JPY'], ['USD','CHF'], ['USD','MYR'], ['CNY','HKD']
        ];
        const chipHTML = ([b, q]) => {
            const p = _fxPair(b, q);
            if (!p) {
                return `<div style="background:rgba(0,0,0,0.35);border:1px solid rgba(148,163,184,0.08);border-radius:7px;padding:5px 11px;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;">
                    <span style="font-size:10px;color:#475569;letter-spacing:0.5px;font-weight:600;">${b}/${q}</span>
                    <span style="font-size:11px;color:#475569;">—</span>
                </div>`;
            }
            const arrow = p.chg > 0.005 ? '↑' : p.chg < -0.005 ? '↓' : '·';
            const chgColor = p.chg > 0.005 ? '#4ade80' : p.chg < -0.005 ? '#f87171' : '#64748b';
            const chgTxt = Math.abs(p.chg) < 0.005 ? '0.00%' : `${p.chg > 0 ? '+' : ''}${p.chg.toFixed(2)}%`;
            return `<div style="background:rgba(0,0,0,0.4);border:1px solid rgba(193,166,115,0.13);border-radius:7px;padding:5px 11px;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;">
                <span style="font-size:10px;color:#94a3b8;letter-spacing:0.6px;font-weight:600;">${b}/${q}</span>
                <span style="font-size:13px;color:#C1A673;font-weight:600;font-family:Montserrat,sans-serif;line-height:1;">${_fmtFXRate(p.rate)}</span>
                <span style="font-size:10px;color:${chgColor};font-family:Montserrat,sans-serif;font-weight:500;">${arrow}${chgTxt}</span>
            </div>`;
        };
        // Render chips TWICE for seamless marquee loop (translateX -50% jumps to start of second copy)
        const setOne = pairs.map(chipHTML).join('');
        return `<div class="fx-strip" onclick="this.classList.toggle('paused')" title="点击暂停/继续滚动" style="margin:6px 0;">
            <div class="fx-strip-label">💱 FX</div>
            <div class="fx-strip-track">${setOne}${setOne}</div>
        </div>`;
    }
    function getRegionCurrencySymbol(cur) {
        return cur==='CNY'?'¥':cur==='JPY'?'¥':cur==='HKD'?'HK$':'$';
    }

    // ===== 现金水位 =====
    function _escCash(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // 更新顶部「💵 现金」键：显示现金占总资产 %，低于红线变红
    function updateCashTabBtn() {
        const btn = document.getElementById('cashTabBtn');
        if (!btn) return;
        const cashUSD = APP.cash.total_usd || 0;
        const redLine = APP.cash.red_line_pct || 20;
        const holdingsUSD = APP.holdings.filter(h => h.qty > 0).reduce((s, h) => {
            const p = APP.prices[h.symbol]?.price || h.avg_cost;
            return s + (h.qty * p * (APP.FX_RATES[h.currency] || 1));
        }, 0);
        const totalAssets = holdingsUSD + cashUSD;
        const hasCash = (APP.cash.positions || []).length > 0;
        const cashPct = totalAssets > 0 ? (cashUSD / totalAssets * 100) : 0;
        const below = hasCash && cashPct < redLine;
        btn.classList.toggle('below', below);
        if (!hasCash) {
            btn.innerHTML = '💵 现金 +';
            btn.title = '未登记现金 · 点击添加';

    // 按地区聚合所有股票（含 today / cumulative 双口径）
    function _computeTodayPLData() {
        const activeHoldings = APP.holdings.filter(h => h.qty > 0);
        let latestSessionDate = '';
        activeHoldings.forEach(h => {
            const pd = APP.prices[h.symbol];
            if (!pd || !pd.prevClose || !pd.price) return;
            const d = getStockSessionDate(h, pd);
            if (d > latestSessionDate) latestSessionDate = d;
        });

        const byRegion = {};
        activeHoldings.forEach(h => {
            const pd = APP.prices[h.symbol];
            if (!pd || !pd.prevClose || !pd.price) return;
            const fx = APP.FX_RATES[h.currency] || 1;
            const dayDeltaLocal = h.qty * (pd.price - pd.prevClose);
            const dayDeltaUSD   = dayDeltaLocal * fx;
            const dayPct = pd.prevClose ? ((pd.price - pd.prevClose) / pd.prevClose) * 100 : 0;
            const cumDeltaLocal = h.qty * (pd.price - (h.avg_cost || 0));
            const cumDeltaUSD   = cumDeltaLocal * fx;
            const cumPct = h.avg_cost > 0 ? ((pd.price - h.avg_cost) / h.avg_cost) * 100 : 0;
            const costBasisUSD = h.qty * (h.avg_cost || 0) * fx;
            const valuePrevUSD = h.qty * pd.prevClose * fx;
            const sessionDate = getStockSessionDate(h, pd);
            const r = h.region || '其他';
            if (!byRegion[r]) {
                byRegion[r] = {
                    included: [], pending: [],
                    todayUSD: 0, todayBaseUSD: 0,
                    cumUSD: 0, cumCostUSD: 0,
                };
            }
            const entry = {
                symbol: h.symbol, name: h.name || h.symbol, qty: h.qty,
                currency: h.currency, sessionDate,
                price: pd.price, prevClose: pd.prevClose, avg_cost: h.avg_cost || 0,
                pctToday: dayPct, amtToday: dayDeltaUSD, amtTodayLocal: dayDeltaLocal,
                pctCum: cumPct, amtCum: cumDeltaUSD, amtCumLocal: cumDeltaLocal,
                // 该股市场当下是否在交易时段内：用于区分"陈旧但市场已开 = 等成交"和"市场未开 = 待开盘"
                marketOpenNow: isMarketOpenNow(pd),
            };
            byRegion[r].cumUSD += cumDeltaUSD;
            byRegion[r].cumCostUSD += costBasisUSD;
            if (sessionDate === latestSessionDate) {
                byRegion[r].included.push(entry);
                byRegion[r].todayUSD += dayDeltaUSD;
                byRegion[r].todayBaseUSD += valuePrevUSD;
            } else {
                byRegion[r].pending.push(entry);
            }
        });
        // 计算每地区的%
        Object.values(byRegion).forEach(info => {
            info.todayPct = info.todayBaseUSD > 0 ? (info.todayUSD / info.todayBaseUSD) * 100 : 0;
            info.cumPct = info.cumCostUSD > 0 ? (info.cumUSD / info.cumCostUSD) * 100 : 0;
        });
        return { byRegion, latestSessionDate };
    }

    function renderTodayPL() {
        const body = document.getElementById('todayPLBreakdownBody');
        const header = document.getElementById('todayPLModalHeader');
        if (!body || !header) return;

    // ===== L1：三地汇总卡 =====
    function renderTodayPL_L1(body, header) {
        const { byRegion, latestSessionDate } = _computeTodayPLData();
        header.innerHTML = `📊 今日浮盈亏 · 三地汇总`;

        // 地区按今日 P&L USD 由高到低
        const regions = Object.entries(byRegion).sort((a, b) => b[1].todayUSD - a[1].todayUSD);
        const flagOf = r => r==='美国'?'🇺🇸':r==='中国'?'🇨🇳':r==='日本'?'🇯🇵':'🌐';
        const cls = v => v >= 0 ? 'price-positive' : 'price-negative';
        const sgn = v => v >= 0 ? '+' : '';

        let html = `
            <div style="font-size:11px;color:#64748b;margin-bottom:14px;line-height:1.5;">
                按"全市场最新会话日期 ${latestSessionDate}"为准。点击任一地区查看个股明细 →
            </div>
        `;

        regions.forEach(([region, info]) => {
            if (info.included.length === 0 && info.pending.length === 0) return;

    // ===== Region drill-down: donut chart + sortable holdings table =====
    const regionDrilldownState = {
        region: null, view: 'pie', sortKey: 'value', sortDir: 'desc',
        date: 'today',          // 'today' 或 YYYY-MM-DD
        asof: null,             // 历史快照: { date, holdings: [...], fx_rates: {...}, failures: [...] }
        asofLoading: false,     // 拉取历史快照中

    };

    function openRegionDrilldown(region) {
        regionDrilldownState.region = region;
        regionDrilldownState.view = 'pie';
        regionDrilldownState.sortKey = 'pctOfTotal';
        regionDrilldownState.sortDir = 'desc';
        regionDrilldownState.date = 'today';
        regionDrilldownState.asof = null;
        regionDrilldownState.asofLoading = false;
        regionDrilldownState.asofError = null;
        regionDrilldownState.openPicker = null;
        _ensureDrilldownOutsideClick();
        renderRegionDrilldown();
        openModal('regionDrilldownModal');
    }

    // 切换到历史日期：拉后端 /api/portfolio-asof 然后重渲染
    async function loadAsofData(dateStr) {
        regionDrilldownState.date = dateStr;
        regionDrilldownState.asofLoading = true;
        regionDrilldownState.asofError = null;
        regionDrilldownState.asof = null;
        renderRegionDrilldown();
        try {
            const data = await apiCall(`/portfolio-asof?date=${encodeURIComponent(dateStr)}`);
            regionDrilldownState.asof = data;
        } catch(e) {
            regionDrilldownState.asofError = e.message || '加载失败';
        } finally {
            regionDrilldownState.asofLoading = false;
            renderRegionDrilldown();
        }
    }
    function resetAsofToToday() {
        regionDrilldownState.date = 'today';
        regionDrilldownState.asof = null;
        regionDrilldownState.asofError = null;
        regionDrilldownState.asofLoading = false;
        renderRegionDrilldown();
    }

    // close any open picker when user clicks outside the pill / dropdown
    let _drilldownOutsideClickAttached = false;
    function _ensureDrilldownOutsideClick() {
        if (_drilldownOutsideClickAttached) return;
        _drilldownOutsideClickAttached = true;
        document.addEventListener('click', (e) => {
            if (!regionDrilldownState.openPicker) return;
            if (e.target.closest && (e.target.closest('.apple-pill') || e.target.closest('.apple-dropdown'))) return;
            regionDrilldownState.openPicker = null;
            renderRegionDrilldown();
        });
    }

    function _togglePicker(which) {
        regionDrilldownState.openPicker = regionDrilldownState.openPicker === which ? null : which;
        renderRegionDrilldown();
    }

    function switchRegionDrilldownView(view) {
        regionDrilldownState.view = view;
        regionDrilldownState.openPicker = null;
        renderRegionDrilldown();
    }

    function setRegionDrilldownRegion(r) {
        regionDrilldownState.region = r;
        regionDrilldownState.openPicker = null;
        renderRegionDrilldown();
    }

    function setRegionDrilldownDate(d) {
        regionDrilldownState.date = d;
        regionDrilldownState.openPicker = null;
        renderRegionDrilldown();
    }

    function setRegionDrilldownSort(key) {
        if (regionDrilldownState.sortKey === key) {
            regionDrilldownState.sortDir = regionDrilldownState.sortDir === 'desc' ? 'asc' : 'desc';
        } else {
            regionDrilldownState.sortKey = key;
            regionDrilldownState.sortDir = (key === 'name' || key === 'symbol') ? 'asc' : 'desc';
        }
        renderRegionDrilldown();
    }

    function _renderDrilldownSelectors(currentRegion) {
        const regions = [...new Set((APP.holdings || []).filter(h => h.qty > 0).map(h => h.region || '其他'))];
        const priority = { '美国':0, '中国':1, '日本':2, '香港':3 };
        regions.sort((a,b) => (priority[a]??99) - (priority[b]??99) || a.localeCompare(b));
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        const open = regionDrilldownState.openPicker;
        const isToday = regionDrilldownState.date === 'today';
        const dateLabel = isToday ? `今日 ${todayStr}` : regionDrilldownState.date;
        const inputVal = isToday ? todayStr : regionDrilldownState.date;

        const dateDropdown = open === 'date' ? `
            <div class="apple-dropdown" onclick="event.stopPropagation()" style="min-width:220px;">
                <div class="apple-dropdown-item ${isToday?'selected':''}" onclick="resetAsofToToday();regionDrilldownState.openPicker=null;renderRegionDrilldown()">
                    <span>📅</span>
                    <span>今日 ${todayStr}</span>

                           onclick="event.stopPropagation()"
                           onchange="regionDrilldownState.openPicker=null;loadAsofData(this.value)"
                           style="background:rgba(15,23,42,0.6);border:1px solid rgba(193,166,115,0.25);color:#e2e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:Montserrat,sans-serif;width:100%;outline:none;color-scheme:dark;">
                    <div style="font-size:10px;color:#64748b;margin-top:5px;line-height:1.4;">
                        历史价 = 该日收盘价（Yahoo 缓存）<br>
                        非交易日自动用最近交易日
                    </div>
                </div>
            </div>` : '';

        const regionItems = regions.map(r => {
            const sel = r === currentRegion ? 'selected' : '';
            const check = r === currentRegion ? '<span class="check">✓</span>' : '';
            return `<div class="apple-dropdown-item ${sel}" onclick="setRegionDrilldownRegion('${r}')">

                <span>${r}</span>

        const regionDropdown = open === 'region' ? `
            <div class="apple-dropdown" onclick="event.stopPropagation()">${regionItems}</div>` : '';

        // 历史日期模式下的状态提示
        const asofStatus = !isToday ? (() => {
            if (regionDrilldownState.asofLoading) return `<span style="font-size:10px;color:#94a3b8;">⏳ 加载历史数据…</span>`;
            if (regionDrilldownState.asofError)   return `<span style="font-size:10px;color:#f87171;">❌ ${regionDrilldownState.asofError}</span>`;
            if (regionDrilldownState.asof) {
                const fails = regionDrilldownState.asof.failures || [];
                if (fails.length > 0) return `<span style="font-size:10px;color:#fbbf24;" title="${fails.map(f=>f.symbol).join(', ')}">⚠️ ${fails.length} 只股价缺失，用成本价代替</span>`;
                return `<span style="font-size:10px;color:#4ade80;">✓ ${regionDrilldownState.asof.date} 历史快照</span>`;
            }
            return '';

        return `
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">

                    <div style="position:relative;">
                        <div class="apple-pill ${open==='date'?'active':''}" onclick="event.stopPropagation();_togglePicker('date')">
                            <span style="font-size:13px;">📅</span>
                            <span style="font-family:'Montserrat',sans-serif;">${dateLabel}</span>
                            <span class="chevron">▾</span>
                        </div>
                        ${dateDropdown}
                    </div>
                    <div style="position:relative;">
                        <div class="apple-pill ${open==='region'?'active':''}" onclick="event.stopPropagation();_togglePicker('region')">
                            <span style="font-size:13px;">${_regionFlag(currentRegion)}</span>
                            <span>${currentRegion}</span>
                            <span class="chevron">▾</span>
                        </div>
                        ${regionDropdown}
                    </div>
                </div>
            </div>
        `;
    }

    function _regionFlag(r) {
        return r==='美国'?'🇺🇸':r==='中国'?'🇨🇳':r==='日本'?'🇯🇵':r==='香港'?'🇭🇰':'🌐';
    }

    function _regionItems(region) {
        // FX-convert each holding from its native currency → region's display currency.
        // E.g. PDD trades in USD but is region=中国 (CNY display): convert USD → CNY.
        const regionCur = getRegionCurrency(region);

        // 历史模式（已加载到 asof 数据） vs 今日实时模式
        const isAsof = regionDrilldownState.date !== 'today' && regionDrilldownState.asof;
        if (isAsof) {
            const snap = regionDrilldownState.asof;
            const fx = snap.fx_rates || APP.FX_RATES;
            const regionRateUSD = fx[regionCur] || 1;
            return (snap.holdings || [])
                .filter(h => h.qty > 0 && (h.region || '其他') === region)
                .map(h => {
                    const nativePrice = h.price || h.avg_cost;
                    const stockRateUSD = fx[h.currency] || 1;
                    const conv = stockRateUSD / regionRateUSD;
                    const price = nativePrice * conv;
                    const avgCost = h.avg_cost * conv;
                    const value = h.qty * price;
                    const cost = h.qty * avgCost;
                    const pl = value - cost;
                    const plPct = cost > 0 ? (pl / cost * 100) : 0;
                    return {
                        symbol: h.symbol, name: h.name || h.symbol,
                        nativeCurrency: h.currency,
                        price, qty: h.qty,
                        value, avgCost, cost, pl, plPct,
                        hasLivePrice: h.price_source !== 'fallback_avgcost',
                        isConverted: h.currency !== regionCur,
                        priceSource: h.price_source,
                    };
                })
                .sort((a, b) => b.value - a.value);
        }

        // 今日实时模式
        const regionRateUSD = APP.FX_RATES[regionCur] || 1;
        return (APP.holdings || [])
            .filter(h => h.qty > 0 && (h.region || '其他') === region)
            .map(h => {
                const pd = APP.prices[h.symbol] || {};
                const nativePrice = pd.price || h.avg_cost;
                const stockRateUSD = APP.FX_RATES[h.currency] || 1;
                const conv = stockRateUSD / regionRateUSD;
                const price = nativePrice * conv;
                const avgCost = h.avg_cost * conv;
                const value = h.qty * price;
                const cost = h.qty * avgCost;
                const pl = value - cost;
                const plPct = cost > 0 ? (pl / cost * 100) : 0;
                return {
                    symbol: h.symbol, name: h.name || h.symbol,
                    nativeCurrency: h.currency,
                    price, qty: h.qty,
                    value, avgCost, cost, pl, plPct,
                    hasLivePrice: !!pd.price,
                    isConverted: h.currency !== regionCur,
                };
            })
            .sort((a, b) => b.value - a.value);
    }

    function renderRegionDrilldown() {
        const body = document.getElementById('regionDrilldownBody');
        const header = document.getElementById('regionDrilldownHeader');
        const r = regionDrilldownState.region;
        if (!body || !header || !r) return;

        const selectorsHTML = _renderDrilldownSelectors(r);
        const items = _regionItems(r);
        if (items.length === 0) {
            header.innerHTML = `${_regionFlag(r)} ${r}`;
            body.innerHTML = selectorsHTML + `<div style="padding:40px 20px;text-align:center;color:#64748b;font-size:13px;">该属地暂无持仓</div>`;
            return;
        }
        // Currency derived from REGION (deterministic): 中国→CNY, 日本→JPY, 香港→HKD, 美国→USD
        const cur = getRegionCurrency(r);
        const curSym = getRegionCurrencySymbol(cur);

        if (regionDrilldownState.view === 'pie') {
            header.innerHTML = `${_regionFlag(r)} ${r} · 资产占比`;
            body.innerHTML = selectorsHTML + _renderRegionPie(items, curSym, r);
        } else {
            header.innerHTML = `${_regionFlag(r)} ${r} · 持仓清单`;
            body.innerHTML = selectorsHTML + _renderRegionTable(items, curSym);
        }
    }

    // ===== Donut chart: gradient slices, leader lines, glow, center label =====
    function _renderRegionPie(items, curSym, region) {
        const total = items.reduce((s, x) => s + x.value, 0);
        // Curated palette — gold-warm + cool accents, paired for variety against dark bg
        const palette = [
            '#E8B84B','#5DADE2','#82C9A6','#C18BD4','#F39C61','#7DB6C9',
            '#D4A574','#A78BCC','#94C9A8','#E89F71','#5499C7','#F0C987',
            '#9C8A5B','#B89968','#76D7C4','#E8908F'
        ];

        const W = 460, H = 340, cx = 230, cy = 170;
        const R_OUT = 130, R_IN = 78;
        const R_LBL = 152;     // leader-line label distance
        const R_INLINE = (R_OUT + R_IN) / 2;

        // Gradient defs (vertical light→dark per slice)
        const gradDefs = palette.map((c, i) =>
            `<linearGradient id="rdg-${i}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="${_lighten(c, 0.18)}"/>
                <stop offset="1" stop-color="${_darken(c, 0.18)}"/>
            </linearGradient>`
        ).join('');

        let acc = 0;
        const slices = [];
        const inlineLabels = [];
        const leaderLines = [];

        // Truncate long Chinese/English names for inline labels
        const _truncName = (s, maxChars) => {
            if (!s) return '';
            // count CJK as 2, ASCII as 1 (rough)
            let len = 0, out = '';
            for (const ch of String(s)) {
                const w = /[一-鿿]/.test(ch) ? 1.6 : 1;
                if (len + w > maxChars) { out += '…'; break; }
                out += ch; len += w;
            }
            return out;
        };

        items.forEach((item, i) => {
            const frac = total > 0 ? item.value / total : 0;
            if (frac === 0) return;
            const colorIdx = i % palette.length;
            const fillId = `url(#rdg-${colorIdx})`;
            const isTopN = i < 5;
            const pctTxt = (frac * 100).toFixed(1) + '%';

            // single full slice → render as full ring
            if (items.length === 1 || frac >= 0.9999) {
                slices.push(`<circle cx="${cx}" cy="${cy}" r="${(R_OUT+R_IN)/2}" fill="none" stroke="${palette[colorIdx]}" stroke-width="${R_OUT-R_IN}"/>`);
                inlineLabels.push(`<text x="${cx}" y="${cy-2}" text-anchor="middle" fill="rgba(15,23,42,0.92)" font-size="11" font-weight="600" font-family="sans-serif">${_esc(_truncName(item.name, 8))}</text>`);
                inlineLabels.push(`<text x="${cx}" y="${cy+14}" text-anchor="middle" fill="rgba(15,23,42,0.92)" font-size="13" font-weight="700" font-family="Montserrat,sans-serif">100%</text>`);
                return;
            }

            const startA = acc * 2 * Math.PI - Math.PI / 2;
            const endA = (acc + frac) * 2 * Math.PI - Math.PI / 2;
            const midA = (startA + endA) / 2;
            acc += frac;
            const large = frac > 0.5 ? 1 : 0;

            // Donut slice path
            const ox1 = (cx + R_OUT * Math.cos(startA)).toFixed(2);
            const oy1 = (cy + R_OUT * Math.sin(startA)).toFixed(2);
            const ox2 = (cx + R_OUT * Math.cos(endA)).toFixed(2);
            const oy2 = (cy + R_OUT * Math.sin(endA)).toFixed(2);
            const ix1 = (cx + R_IN * Math.cos(startA)).toFixed(2);
            const iy1 = (cy + R_IN * Math.sin(startA)).toFixed(2);
            const ix2 = (cx + R_IN * Math.cos(endA)).toFixed(2);
            const iy2 = (cy + R_IN * Math.sin(endA)).toFixed(2);
            const path = `M ${ox1} ${oy1} A ${R_OUT} ${R_OUT} 0 ${large} 1 ${ox2} ${oy2} L ${ix2} ${iy2} A ${R_IN} ${R_IN} 0 ${large} 0 ${ix1} ${iy1} Z`;

            slices.push(`<path d="${path}" fill="${fillId}" stroke="rgba(11,15,18,0.7)" stroke-width="1.5" style="transition:filter 0.2s;cursor:pointer;" onmouseover="this.style.filter='brightness(1.18) drop-shadow(0 0 8px ${palette[colorIdx]}aa)'" onmouseout="this.style.filter=''"><title>${_esc(item.name)} · ${curSym}${fmtNum(item.value)} · ${pctTxt}</title></path>`);

            // Inline label for big slices (≥ 8%): top-N gets name + %, others get just %
            if (frac >= 0.08) {
                const lx = (cx + R_INLINE * Math.cos(midA)).toFixed(2);
                const ly = (cy + R_INLINE * Math.sin(midA)).toFixed(2);
                if (isTopN) {
                    inlineLabels.push(`<text x="${lx}" y="${parseFloat(ly)-7}" text-anchor="middle" dominant-baseline="middle" fill="rgba(15,23,42,0.95)" font-size="10.5" font-weight="600" font-family="sans-serif" pointer-events="none">${_esc(_truncName(item.name, 6))}</text>`);
                    inlineLabels.push(`<text x="${lx}" y="${parseFloat(ly)+7}" text-anchor="middle" dominant-baseline="middle" fill="rgba(15,23,42,0.95)" font-size="12" font-weight="700" font-family="Montserrat,sans-serif" pointer-events="none">${pctTxt}</text>`);
                } else {
                    inlineLabels.push(`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="rgba(15,23,42,0.9)" font-size="12" font-weight="700" font-family="Montserrat,sans-serif" pointer-events="none">${pctTxt}</text>`);
                }
                return;
            }

            // Leader line: ALL top-N slices that aren't already inline-labeled, plus medium slices (2-8%)
            const wantsLeader = isTopN || (frac >= 0.02 && frac < 0.08);
            if (wantsLeader) {
                const x1 = (cx + (R_OUT + 2) * Math.cos(midA)).toFixed(2);
                const y1 = (cy + (R_OUT + 2) * Math.sin(midA)).toFixed(2);
                const x2 = (cx + R_LBL * Math.cos(midA)).toFixed(2);
                const y2 = (cy + R_LBL * Math.sin(midA)).toFixed(2);
                const onRight = Math.cos(midA) >= 0;
                const x3 = (parseFloat(x2) + (onRight ? 6 : -6)).toFixed(2);
                const anchor = onRight ? 'start' : 'end';
                leaderLines.push(`<polyline points="${x1},${y1} ${x2},${y2} ${x3},${y2}" fill="none" stroke="${palette[colorIdx]}" stroke-width="1" opacity="0.6"/>`);
                if (isTopN) {
                    leaderLines.push(`<text x="${parseFloat(x3) + (onRight ? 2 : -2)}" y="${parseFloat(y2)-5}" text-anchor="${anchor}" dominant-baseline="middle" fill="#e2e8f0" font-size="10.5" font-weight="600" font-family="sans-serif" pointer-events="none">${_esc(_truncName(item.name, 6))}</text>`);
                    leaderLines.push(`<text x="${parseFloat(x3) + (onRight ? 2 : -2)}" y="${parseFloat(y2)+7}" text-anchor="${anchor}" dominant-baseline="middle" fill="${palette[colorIdx]}" font-size="10" font-weight="600" font-family="Montserrat,sans-serif" pointer-events="none">${pctTxt}</text>`);
                } else {
                    leaderLines.push(`<text x="${parseFloat(x3) + (onRight ? 2 : -2)}" y="${y2}" text-anchor="${anchor}" dominant-baseline="middle" fill="#cbd5e1" font-size="10" font-family="Montserrat,sans-serif" pointer-events="none">${pctTxt}</text>`);
                }
            }
        });

        const flag = _regionFlag(region);
        const centerSVG = `
            <text x="${cx}" y="${cy-22}" text-anchor="middle" font-size="22" pointer-events="none">${flag}</text>
            <text x="${cx}" y="${cy+2}" text-anchor="middle" fill="#94a3b8" font-size="9" letter-spacing="2" font-weight="600" pointer-events="none">TOTAL</text>
            <text x="${cx}" y="${cy+22}" text-anchor="middle" fill="#C1A673" font-size="16" font-weight="700" font-family="Montserrat,sans-serif" pointer-events="none">${curSym}${fmtNum(total, 0)}</text>
            <text x="${cx}" y="${cy+38}" text-anchor="middle" fill="#64748b" font-size="10" font-family="Montserrat,sans-serif" pointer-events="none">${items.length} 支</text>
        `;

        // Legend: CSS Grid 14px (色块) + 4 列等宽 (占比 / 名称代码 / 持仓金额 / 数量)
        // 占比列：居中 + 700 加粗 + 13px 突出
        const grid = 'display:grid;grid-template-columns:14px 1fr 1fr 1fr 1fr;gap:10px;align-items:center;';
        const legendHeader = `<div style="${grid}padding:6px 4px 8px;font-size:9px;color:#64748b;letter-spacing:1px;font-weight:600;border-bottom:1px solid rgba(193,166,115,0.12);">
            <span></span>
            <span style="text-align:center;">占比</span>
            <span>名称 / 代码</span>
            <span style="text-align:right;">持仓金额</span>
            <span style="text-align:right;">数量</span>
        </div>`;
        const legend = legendHeader + items.map((item, i) => {
            const pct = total > 0 ? item.value / total * 100 : 0;
            const c = palette[i % palette.length];
            return `<div style="${grid}padding:7px 4px;border-bottom:1px solid rgba(193,166,115,0.05);font-size:12px;">
                <div style="width:9px;height:9px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c}66;"></div>
                <span style="text-align:center;color:#C1A673;font-weight:700;font-family:Montserrat,sans-serif;font-size:13px;">${pct.toFixed(1)}%</span>
                <div style="min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden;">
                    <span style="color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${_esc(item.name)}</span>
                    <span style="color:#64748b;font-family:Montserrat,sans-serif;font-size:10px;flex-shrink:0;">${item.symbol}</span>
                </div>
                <span style="color:#cbd5e1;font-family:Montserrat,sans-serif;font-weight:500;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${curSym}${fmtNum(item.value)}</span>
                <span style="color:#94a3b8;font-family:Montserrat,sans-serif;text-align:right;white-space:nowrap;">${fmtNum(item.qty, 0)}</span>
            </div>`;
        }).join('');

        return `
            <div style="display:flex;gap:20px;margin-top:8px;flex-wrap:wrap;align-items:center;">
                <div onclick="switchRegionDrilldownView('table')" style="cursor:pointer;flex:0 0 auto;text-align:center;padding:4px;border-radius:14px;transition:background 0.2s;" onmouseover="this.style.background='rgba(193,166,115,0.04)'" onmouseout="this.style.background='transparent'">
                    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="filter:drop-shadow(0 8px 22px rgba(0,0,0,0.5));">
                        <defs>${gradDefs}</defs>
                        ${slices.join('')}
                        ${leaderLines.join('')}
                        ${inlineLabels.join('')}
                        ${centerSVG}
                    </svg>
                    <div style="font-size:10px;color:#94a3b8;margin-top:-4px;letter-spacing:1.5px;">点击饼图查看明细 →</div>
                </div>
                <div style="flex:1;min-width:240px;max-height:340px;overflow-y:auto;padding-right:4px;">${legend}</div>
            </div>
        `;
    }

    function _lighten(hex, amt) { return _shade(hex, amt); }
    function _darken(hex, amt)  { return _shade(hex, -amt); }
    function _shade(hex, amt) {
        const m = hex.match(/^#([0-9a-f]{6})$/i);
        if (!m) return hex;
        const n = parseInt(m[1], 16);
        let r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
        const adj = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
        r = adj(r); g = adj(g); b = adj(b);
        return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    }
    function _esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function _sortHeaderCell(label, key, align, currentKey, currentDir) {
        const active = currentKey === key;
        const upColor   = active && currentDir === 'asc'  ? '#C1A673' : '#475569';
        const downColor = active && currentDir === 'desc' ? '#C1A673' : '#475569';
        return `<th onclick="setRegionDrilldownSort('${key}')" style="padding:9px 10px;text-align:${align};font-weight:500;cursor:pointer;white-space:nowrap;user-select:none;color:${active?'#C1A673':'#94a3b8'};" onmouseover="this.style.background='rgba(193,166,115,0.08)'" onmouseout="this.style.background=''">
            <span>${label}</span>
            <span style="display:inline-flex;flex-direction:column;line-height:0.6;margin-left:4px;vertical-align:middle;font-size:7px;">
                <span style="color:${upColor};">▲</span>
                <span style="color:${downColor};margin-top:1px;">▼</span>
            </span>
        </th>`;
    }

    function _renderRegionTable(items, curSym) {
        const total = items.reduce((s, x) => s + x.value, 0);
        const augmented = items.map(it => ({ ...it, pctOfTotal: total > 0 ? it.value / total * 100 : 0 }));
        const { sortKey, sortDir } = regionDrilldownState;
        augmented.sort((a, b) => {
            let av = a[sortKey], bv = b[sortKey];
            if (typeof av === 'string') {
                const cmp = av.localeCompare(bv);
                return sortDir === 'asc' ? cmp : -cmp;
            }
            return sortDir === 'asc' ? av - bv : bv - av;
        });

        const td = (extra='') => `padding:9px 10px;font-family:Montserrat,sans-serif;white-space:nowrap;${extra}`;
        const rows = augmented.map(item => {
            const plClass = item.pl >= 0 ? 'price-positive' : 'price-negative';
            const sign = item.pl >= 0 ? '+' : '';
            const priceCell = item.hasLivePrice
                ? `${curSym}${fmtNum(item.price, 2)}`
                : `<span style="color:#64748b;" title="无实时价，按成本均价显示">${curSym}${fmtNum(item.price, 2)}</span>`;
            return `<tr style="border-bottom:1px solid rgba(193,166,115,0.05);">
                <td style="${td('text-align:center;color:#C1A673;font-weight:800;font-size:13px;')}">${item.pctOfTotal.toFixed(2)}%</td>
                <td style="${td('color:#e2e8f0;font-family:inherit;')}"><span class="dd-name" title="${_esc(item.name)}">${_esc(item.name)}</span></td>
                <td style="${td('color:#64748b;font-size:11px;')}">${item.symbol}</td>
                <td style="${td('text-align:right;color:#C1A673;font-weight:600;')}">${curSym}${fmtNum(item.value)}</td>
                <td style="${td('text-align:right;color:#cbd5e1;')}">${fmtNum(item.qty, 0)}</td>
                <td style="${td('text-align:right;color:#cbd5e1;')}">${curSym}${fmtNum(item.avgCost, 2)}</td>
                <td style="${td('text-align:right;color:#cbd5e1;')}">${priceCell}</td>
                <td class="${plClass}" style="${td('text-align:right;font-weight:600;')}">${sign}${curSym}${fmtNum(item.pl)}</td>
                <td class="${plClass}" style="${td('text-align:right;font-weight:600;')}">${formatPercent(item.plPct)}</td>
            </tr>`;
        }).join('');
        const totalCost = items.reduce((s, x) => s + x.cost, 0);
        const totalPL = total - totalCost;
        const totalPct = totalCost > 0 ? (totalPL / totalCost * 100) : 0;
        const totalClass = totalPL >= 0 ? 'price-positive' : 'price-negative';
        const totalSign = totalPL >= 0 ? '+' : '';
        const sk = regionDrilldownState.sortKey, sd = regionDrilldownState.sortDir;

        return `
            <button onclick="switchRegionDrilldownView('pie')" style="background:rgba(193,166,115,0.1);border:1px solid rgba(193,166,115,0.2);color:#C1A673;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;margin-bottom:12px;letter-spacing:0.5px;">← 返回饼图</button>
            <div class="dd-scroll">
            <table class="dd-table" style="width:100%;border-collapse:collapse;font-size:12.5px;table-layout:auto;">
                <thead>
                    <tr style="background:rgba(15,23,42,0.55);font-size:10px;letter-spacing:0.6px;">
                        ${_sortHeaderCell('占比%',      'pctOfTotal', 'center', sk, sd)}
                        ${_sortHeaderCell('名称',       'name',       'left',  sk, sd)}
                        ${_sortHeaderCell('代码',       'symbol',     'left',  sk, sd)}
                        ${_sortHeaderCell('持仓金额',   'value',      'right', sk, sd)}
                        ${_sortHeaderCell('数量',       'qty',        'right', sk, sd)}
                        ${_sortHeaderCell('平均成本',   'avgCost',    'right', sk, sd)}
                        ${_sortHeaderCell('当前价格',   'price',      'right', sk, sd)}
                        ${_sortHeaderCell('浮盈亏金额', 'pl',         'right', sk, sd)}
                        ${_sortHeaderCell('率',         'plPct',      'right', sk, sd)}
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
                <tfoot>
                    <tr style="background:rgba(15,23,42,0.4);border-top:2px solid rgba(193,166,115,0.2);font-weight:600;">
                        <td style="padding:10px;text-align:center;font-family:Montserrat,sans-serif;color:#C1A673;font-weight:800;font-size:13px;white-space:nowrap;">100.00%</td>
                        <td style="padding:10px;color:#94a3b8;font-size:11px;letter-spacing:0.5px;white-space:nowrap;">合计 ${items.length} 支</td>
                        <td></td>
                        <td style="padding:10px;text-align:right;font-family:Montserrat,sans-serif;color:#C1A673;white-space:nowrap;">${curSym}${fmtNum(total)}</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td class="${totalClass}" style="padding:10px;text-align:right;font-family:Montserrat,sans-serif;white-space:nowrap;">${totalSign}${curSym}${fmtNum(totalPL)}</td>
                        <td class="${totalClass}" style="padding:10px;text-align:right;font-family:Montserrat,sans-serif;white-space:nowrap;">${formatPercent(totalPct)}</td>
                    </tr>
                </tfoot>
            </table>
            </div>
        `;
    }

    async function changePassword() {
        const oldPwd = document.getElementById('oldPwd').value;
        const newPwd = document.getElementById('newPwd').value;
        const confirmPwd = document.getElementById('confirmPwd').value;
        if (!oldPwd || !newPwd) return alert('Please enter old and new password');
        if (newPwd.length < 4) return alert('New password must be at least 4 characters');
        if (newPwd !== confirmPwd) return alert('Passwords do not match, please try again');
        try {
            await apiCall('/change-password', 'POST', { oldPassword: oldPwd, newPassword: newPwd });
            alert('Password changed successfully! Please sign in again with your new password.');
            // Force logout and re-login with new password
            APP.token = null;
            APP.username = null;
            localStorage.removeItem('kxm_token');
            localStorage.removeItem('kxm_user');
            showLogin();
        } catch(e) { alert('Change failed, please check if old password is correct'); }
    }

    // ===== Phase 3.6: 股票输入框自动补全（代码 / 中文名 / 英文名 都能搜）=====
    function showSymbolAutocomplete(inputId, dropdownId, onSelectFnName) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        if (!input || !dropdown) return;
        const q = (input.value || '').trim();
        if (!q || q.length < 1) {
            dropdown.style.display = 'none';
            return;
        }
        const qUpper = q.toUpperCase();
        // 在持仓里搜：symbol 前缀 OR symbol 包含 OR name 包含（中英都行）
        const seen = new Set();
        const matches = APP.holdings
            .filter(h => h.qty > 0 || h.qty === 0)  // 包括清仓的也允许
            .filter(h => {
                const sym = (h.symbol || '').toUpperCase();
                const nm = (h.name || '');
                const hit = sym.includes(qUpper) || nm.includes(q) || nm.toUpperCase().includes(qUpper);
                if (!hit) return false;
                if (seen.has(sym)) return false;
                seen.add(sym);
                return true;
            })
            // 排序：symbol 完全相等 > symbol 前缀 > 其他
            .sort((a, b) => {
                const sa = a.symbol.toUpperCase(), sb = b.symbol.toUpperCase();
                if (sa === qUpper) return -1;
                if (sb === qUpper) return 1;
                if (sa.startsWith(qUpper) && !sb.startsWith(qUpper)) return -1;
                if (sb.startsWith(qUpper) && !sa.startsWith(qUpper)) return 1;
                return 0;
            })
            .slice(0, 8);

        if (matches.length === 0) {
            dropdown.style.display = 'none';
            return;
        }

        const flagOf = r => r==='美国'?'🇺🇸':r==='中国'?'🇨🇳':r==='日本'?'🇯🇵':'';
        dropdown.innerHTML = matches.map(h => {
            // mousedown 在 input.onblur 之前触发，所以选中能稳定生效
            const safeSym = (h.symbol || '').replace(/'/g, "\\'");
            return `
                <div class="symbol-autocomplete-item" onmousedown="event.preventDefault(); ${onSelectFnName}('${safeSym}')">
                    <span class="ac-sym">${h.symbol}</span>
                    <span class="ac-name">${h.name || ''}</span>
                    <span class="ac-region">${flagOf(h.region)} ${h.region || ''}</span>
                </div>
            `;
        }).join('');
        dropdown.style.display = 'block';
    }
