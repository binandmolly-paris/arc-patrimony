    async function autoFillTrade() {
        let sym = document.getElementById('tradeSymbol').value.trim();
        if (!sym) return;
        // Phase 3.6: 如果输入里含中文/日文等非 ASCII，先试着按 name 在 holdings 里匹配
        if (/[^\x00-\x7F]/.test(sym)) {
            const nameHit = APP.holdings.find(h => (h.name || '') === sym)
                          || APP.holdings.find(h => (h.name || '').includes(sym));
            if (nameHit) {
                sym = nameHit.symbol;
            }
        }
        sym = sym.toUpperCase();
        document.getElementById('tradeSymbol').value = sym;

        // Look up from existing holdings
        const match = APP.holdings.find(h => h.symbol.toUpperCase() === sym);
        if (match) {
            document.getElementById('tradeName').value = match.name;
            document.getElementById('tradeCurrency').value = match.currency;
            document.getElementById('tradeRegion').value = match.region;
            if (match.attribute) document.getElementById('tradeAttribute').value = match.attribute;
            if (match.sector) document.getElementById('tradeSector').value = match.sector;
            const pd = APP.prices[match.symbol];
            const price = pd && pd.price ? pd.price : match.avg_cost;
            document.getElementById('tradePrice').value = price.toFixed(2);
            refreshTradeFormForAction();
            return;
        }

        // Not in holdings — call server lookup API
        try {
            const nameEl = document.getElementById('tradeName');
            nameEl.value = '查询中...';
            const data = await fetch(`${API_BASE}/stock-lookup?symbol=${encodeURIComponent(sym)}`).then(r => r.json());
            if (data.found) {
                nameEl.value = data.name;
                document.getElementById('tradeCurrency').value = data.currency;
                document.getElementById('tradeRegion').value = data.region;
                if (data.price > 0) document.getElementById('tradePrice').value = data.price.toFixed(2);
                // Correct the symbol if Yahoo returns a different one
                if (data.symbol && data.symbol !== sym) {
                    document.getElementById('tradeSymbol').value = data.symbol;
                }
            } else {
                nameEl.value = '';
                // Fallback: detect from suffix
                if (sym.endsWith('.HK')) {
                    document.getElementById('tradeCurrency').value = 'HKD';
                    document.getElementById('tradeRegion').value = '中国';
                } else if (sym.endsWith('.T')) {
                    document.getElementById('tradeCurrency').value = 'JPY';
                    document.getElementById('tradeRegion').value = '日本';
                } else if (sym.endsWith('.SS') || sym.endsWith('.SZ')) {
                    document.getElementById('tradeCurrency').value = 'CNY';
                    document.getElementById('tradeRegion').value = '中国';
                } else {
                    document.getElementById('tradeCurrency').value = 'USD';
                    document.getElementById('tradeRegion').value = '美国';
                }
            }
            refreshTradeFormForAction();
        } catch(e) {
            console.warn('Stock lookup failed:', e.message);
            document.getElementById('tradeName').value = '';
        }
    }

    async function autoFillAlert() {
        let raw = document.getElementById('alertSymbol').value.trim();
        if (!raw) return;
        // Phase 3.6: 输入是中文 name，反查 symbol
        if (/[^\x00-\x7F]/.test(raw)) {
            const nameHit = APP.holdings.find(h => (h.name || '') === raw)
                          || APP.holdings.find(h => (h.name || '').includes(raw));
            if (nameHit) raw = nameHit.symbol;
        }
        let sym = raw.toUpperCase();
        document.getElementById('alertSymbol').value = sym;
        const match = APP.holdings.find(h => h.symbol.toUpperCase() === sym);
        if (match) {
            document.getElementById('alertName').value = match.name;
            return;
        }
        try {
            document.getElementById('alertName').value = '查询中...';
            const data = await fetch(`${API_BASE}/stock-lookup?symbol=${encodeURIComponent(sym)}`).then(r => r.json());
            document.getElementById('alertName').value = data.found ? data.name : '';
            if (data.symbol && data.symbol !== sym) document.getElementById('alertSymbol').value = data.symbol;
        } catch(e) {
            document.getElementById('alertName').value = '';
        }
    }

    // ===== Two-step Trade Modal: action picker + dynamic form =====

    // Effective currency for the current trade context (Buy reads visible select; Sell/Dividend reads hidden carrier)
    function currentTradeCurrency() {
        const action = document.getElementById('tradeType')?.value;
        if (action === '买入') return document.getElementById('tradeCurrency')?.value || 'USD';
        return document.getElementById('tradeCurrencyHidden')?.value || 'USD';
    }

    // Refresh labels (qty/price/fee) based on current action + currency
    function refreshTradeFormForAction(action) {
        action = action || document.getElementById('tradeType')?.value || '';
        const cur = currentTradeCurrency();
        const qtyLabel = document.getElementById('tradeQtyLabel');
        const priceLabel = document.getElementById('tradePriceLabel');
        const feeLabel = document.getElementById('tradeFeeLabel');
        const hint = document.getElementById('tradeQtyHint');
        if (!qtyLabel) return;

        if (action === '分红') {
            qtyLabel.textContent = 'Shares Eligible / 持股数';
            priceLabel.textContent = `Dividend per Share (${cur})`;
            feeLabel.textContent = `Tax (${cur})`;
            if (hint) { hint.style.display = 'block'; hint.textContent = '通常等于持仓数量；总分红 = 此值 × 每股分红'; }
        } else if (action === '卖出') {
            qtyLabel.textContent = 'Sell Quantity / 卖出数量';
            priceLabel.textContent = `Sell Price (${cur})`;
            feeLabel.textContent = `Fee (${cur})`;
            if (hint) hint.style.display = 'none';
        } else {
            qtyLabel.textContent = 'Buy Quantity / 买入数量';
            priceLabel.textContent = `Buy Price (${cur})`;
            feeLabel.textContent = `Fee (${cur})`;
            if (hint) hint.style.display = 'none';
        }
        updateTradeTotalPreview();
    }

    // Live total preview ("Total: ¥123,456")
    function updateTradeTotalPreview() {
        const action = document.getElementById('tradeType')?.value;
        const qty = parseFloat(document.getElementById('tradeQty')?.value) || 0;
        const price = parseFloat(document.getElementById('tradePrice')?.value) || 0;
        const fee = parseFloat(document.getElementById('tradeFee')?.value) || 0;
        const cur = currentTradeCurrency();
        const sym = cur === 'CNY' ? '¥' : cur === 'JPY' ? '¥' : cur === 'HKD' ? 'HK$' : '$';
        const preview = document.getElementById('tradeTotalPreview');
        if (!preview) return;
        if (qty > 0 && price > 0) {
            const gross = qty * price;
            const net = action === '买入' ? gross + fee : action === '卖出' ? gross - fee : gross - fee;
            const labelGross = action === '分红' ? 'Total Dividend' : 'Gross';
            const labelNet = action === '买入' ? 'Total Cost' : action === '卖出' ? 'Net Proceeds' : 'Net Income';
            preview.style.display = 'block';
            preview.innerHTML = `<span style="color:#94a3b8;">${labelGross}:</span> <span style="color:#cbd5e1;font-weight:600;">${sym}${fmtNum(gross)}</span>`
                + (fee > 0 ? ` &nbsp;·&nbsp; <span style="color:#94a3b8;">Fee:</span> <span style="color:#94a3b8;">${sym}${fmtNum(fee)}</span>` : '')
                + ` &nbsp;<span style="color:#64748b;">→</span>&nbsp; <span style="color:#C1A673;font-weight:700;">${labelNet}: ${sym}${fmtNum(net)}</span>`;
        } else {
            preview.style.display = 'none';
        }
        // 现金联动提示
        const syncHint = document.getElementById('tradeSyncCashHint');
        if (syncHint) {
            if (qty > 0 && price > 0) {
                const gross = qty * price;
                const net = action === '买入' ? gross + fee : gross - fee;
                const dir = action === '买入' ? '扣减' : '增加';
                syncHint.textContent = `（${dir} ${cur} ${sym}${fmtNum(net)}）`;
            } else {
                syncHint.textContent = `（自动加减 ${cur} 现金）`;
            }
        }
    }

    // Step 1: user clicked an action card
    function setTradeAction(action) {
        document.getElementById('tradeType').value = action;

        // Highlight the selected card
        document.querySelectorAll('.trade-action-card').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.action === action);
        });

        // Show form body
        document.getElementById('tradeFormBody').style.display = 'block';

        // Toggle conditional sections
        document.querySelectorAll('[data-show-for]').forEach(el => {
            const allowed = el.dataset.showFor.split(',');
            // Use original display style; for visible we restore '' (default), hidden -> 'none'
            if (allowed.includes(action)) {
                if (el.id === 'tradeStockInfo') {
                    // Only show when a holding has been picked
                    if (el.innerHTML.trim()) el.style.display = ''; else el.style.display = 'none';
                } else {
                    el.style.display = '';
                }
            } else {
                el.style.display = 'none';
            }
        });

        // Symbol field behavior:
        //   Buy → free text input + autoFillTrade lookup
        //   Sell / Dividend → quick-pick chips of existing holdings
        const picker = document.getElementById('tradeHoldingPicker');
        const symbolInput = document.getElementById('tradeSymbol');
        const symbolLabel = document.getElementById('tradeSymbolLabel');
        if (action === '买入') {
            picker.style.display = 'none';
            symbolInput.placeholder = 'e.g. AAPL / 0700.HK / 7203.T / 600036.SS';
            symbolInput.readOnly = false;
            symbolLabel.textContent = 'Stock Symbol';
            // Reset stock info card
            const info = document.getElementById('tradeStockInfo');
            info.innerHTML = ''; info.style.display = 'none';
        } else {
            picker.style.display = 'block';
            symbolInput.placeholder = 'Pick from holdings below';
            symbolInput.readOnly = true; // force user to pick
            symbolLabel.textContent = 'Stock (from holdings)';
            renderHoldingPickerChips();
        }

        // Update labels & preview
        refreshTradeFormForAction(action);

        // Submit button label
        const btn = document.getElementById('tradeSubmitBtn');
        if (btn) btn.textContent = action === '买入' ? 'Save Buy' : action === '卖出' ? 'Save Sell' : 'Save Dividend';

        // Default date today
        const dateInput = document.getElementById('tradeDate');
        if (dateInput && !dateInput.value) dateInput.value = new Date().toISOString().split('T')[0];
    }

    // Render quick-pick chips of existing (qty>0) holdings
    function renderHoldingPickerChips() {
        const wrap = document.getElementById('tradeHoldingPickerChips');
        const active = APP.holdings.filter(h => h.qty > 0);
        if (active.length === 0) {
            wrap.innerHTML = '<div style="font-size:12px;color:#f87171;padding:6px;">No active holdings. Buy first.</div>';
            return;
        }
        wrap.innerHTML = active.map(h =>
            `<button type="button" class="holding-pick-chip" data-symbol="${h.symbol}" onclick="pickHoldingForTrade('${h.symbol}')">${h.symbol}</button>`
        ).join('');
    }

    // User clicked a holding chip (or auto-pick)
    function pickHoldingForTrade(symbol) {
        const h = APP.holdings.find(x => x.symbol === symbol);
        if (!h) return;
        const action = document.getElementById('tradeType').value;

        // Highlight selected chip
        document.querySelectorAll('.holding-pick-chip').forEach(c => {
            c.classList.toggle('selected', c.dataset.symbol === symbol);
        });

        document.getElementById('tradeSymbol').value = symbol;

        // Stash holding metadata into hidden carriers (so submitTrade can read them)
        document.getElementById('tradeNameHidden').value = h.name || '';
        document.getElementById('tradeCurrencyHidden').value = h.currency || 'USD';
        document.getElementById('tradeMarketHidden').value = h.market || 'STOCK';
        document.getElementById('tradeRegionHidden').value = h.region || '';
        document.getElementById('tradeAttributeHidden').value = h.attribute || '';
        document.getElementById('tradeSectorHidden').value = h.sector || '';

        // Show stock info card
        const info = document.getElementById('tradeStockInfo');
        const cs = h.currency==='CNY'?'¥':h.currency==='JPY'?'¥':h.currency==='HKD'?'HK$':'$';
        const px = APP.prices[symbol]?.price || h.avg_cost;
        info.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                <div style="min-width:0;">
                    <div style="font-size:14px;font-weight:600;color:#EADDBC;font-family:Montserrat,sans-serif;">${h.symbol} · ${h.name||''}</div>
                    <div style="font-size:11px;color:#94a3b8;margin-top:2px;">${h.region||''} · ${h.currency} · ${h.attribute||'-'} · ${h.sector||'-'}</div>
                </div>
                <div style="text-align:right;flex-shrink:0;">
                    <div style="font-size:10px;color:#94a3b8;letter-spacing:0.6px;">HELD · ${cs}${fmtNum(px)} now</div>
                    <div style="font-size:18px;font-weight:700;color:#C1A673;font-family:Montserrat,sans-serif;line-height:1.1;">${fmtNum(h.qty,0)} shares</div>
                    <div style="font-size:10px;color:#64748b;">avg cost ${cs}${fmtNum(h.avg_cost)}</div>
                </div>
            </div>`;
        info.style.display = '';

        // Auto-fill defaults
        if (action === '分红') {
            // Pre-fill qty = current shares held (typical case); price empty for user to type per-share dividend
            document.getElementById('tradeQty').value = h.qty;
            document.getElementById('tradePrice').value = '';
            document.getElementById('tradePrice').focus();
        } else if (action === '卖出') {
            // Default qty empty with hint; price = current market price
            document.getElementById('tradeQty').value = '';
            document.getElementById('tradeQty').placeholder = `Max ${fmtNum(h.qty,0)}`;
            document.getElementById('tradePrice').value = px ? px.toFixed(2) : '';
            const hint = document.getElementById('tradeQtyHint');
            if (hint) { hint.style.display = 'block'; hint.textContent = `当前持有 ${fmtNum(h.qty,0)} 股`; }
            document.getElementById('tradeQty').focus();
        }
        refreshTradeFormForAction(action);
    }

    // Reset modal to step-1 state
    function resetTradeModal() {
        document.getElementById('tradeType').value = '';
        document.getElementById('tradeFormBody').style.display = 'none';
        document.querySelectorAll('.trade-action-card').forEach(btn => btn.classList.remove('active'));
        const info = document.getElementById('tradeStockInfo');
        if (info) { info.innerHTML = ''; info.style.display = 'none'; }
        const picker = document.getElementById('tradeHoldingPicker');
        if (picker) picker.style.display = 'none';
        const preview = document.getElementById('tradeTotalPreview');
        if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }

        ['tradeSymbol','tradeName','tradeQty','tradePrice','tradeFee','tradeAttribute','tradeSector'].forEach(id => {
            const el = document.getElementById(id); if (el) el.value = '';
        });
        ['tradeNameHidden','tradeAttributeHidden','tradeSectorHidden'].forEach(id => {
            const el = document.getElementById(id); if (el) el.value = '';
        });
        document.getElementById('tradeQty').placeholder = '0';
        document.getElementById('tradePrice').placeholder = '0.00';
        const sym = document.getElementById('tradeSymbol');
        if (sym) sym.readOnly = false;
        const dateInput = document.getElementById('tradeDate');
        if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];

        // Bind live preview listeners (idempotent)
        ['tradeQty','tradePrice','tradeFee'].forEach(id => {
            const el = document.getElementById(id);
            if (el && !el._previewBound) { el.addEventListener('input', updateTradeTotalPreview); el._previewBound = true; }
        });
        const cur = document.getElementById('tradeCurrency');
        if (cur && !cur._refreshBound) { cur.addEventListener('change', () => refreshTradeFormForAction()); cur._refreshBound = true; }
    }

    async function submitTrade() {
        const type = document.getElementById('tradeType').value;
        if (!type) { alert('Please choose Buy / Sell / Dividend first'); return; }

        const symbol = document.getElementById('tradeSymbol').value.trim();
        const qty = parseFloat(document.getElementById('tradeQty').value);
        const price = parseFloat(document.getElementById('tradePrice').value);
        const fee = parseFloat(document.getElementById('tradeFee').value) || 0;
        const date = document.getElementById('tradeDate').value;

        // Field source differs by action: Buy uses visible selects; Sell/Dividend uses hidden carriers
        let name, currency, market, region, attribute, sector;
        if (type === '买入') {
            name = document.getElementById('tradeName').value.trim();
            currency = document.getElementById('tradeCurrency').value;
            market = document.getElementById('tradeMarket').value;
            region = document.getElementById('tradeRegion').value;
            attribute = document.getElementById('tradeAttribute').value;
            sector = document.getElementById('tradeSector').value;
        } else {
            name = document.getElementById('tradeNameHidden').value;
            currency = document.getElementById('tradeCurrencyHidden').value;
            market = document.getElementById('tradeMarketHidden').value;
            region = document.getElementById('tradeRegionHidden').value;
            attribute = document.getElementById('tradeAttributeHidden').value;
            sector = document.getElementById('tradeSectorHidden').value;
        }

        // Action-specific validation
        if (!symbol) { alert('Please pick or enter a stock symbol'); return; }
        if (!date) { alert('Please choose a date'); return; }
        if (!(qty > 0)) { alert('Quantity must be > 0'); return; }
        if (!(price > 0)) { alert(type === '分红' ? 'Dividend per share must be > 0' : 'Price must be > 0'); return; }
        if (type === '买入' && !name) { alert('Please enter the stock name'); return; }
        if (type === '卖出') {
            const h = APP.holdings.find(x => x.symbol === symbol);
            if (!h || h.qty <= 0) { alert('No active position for ' + symbol); return; }
            if (qty > h.qty + 1e-6) {
                if (!confirm(`卖出数量 ${qty} 超过当前持仓 ${h.qty}. 仍要继续？`)) return;
            }
        }

        const syncCash = document.getElementById('tradeSyncCash')?.checked !== false;

        try {
            await apiCall('/trade', 'POST', {
                symbol, name, type, qty, price, fee, date, currency, market, region, attribute, sector, syncCash
            });

            // Reload data and re-render
            await Promise.all([loadHoldings(), loadTrades(), loadCash(), updateFXRates()]);
            await updatePrices();
            updateCashTabBtn();

            closeModal('tradeModal');

            renderTab0();
            renderTab1();
            renderTab2();
            renderTab4();
            if (typeof renderTab5Portfolio === 'function') {
                try { renderTab5Portfolio(); } catch(e) {}
            }
        } catch (error) {
            alert('Failed to save trade: ' + error.message);
        }
    }

    async function submitAlert() {
        const symbol = document.getElementById('alertSymbol').value;
        const name = document.getElementById('alertName').value;
        const condition = document.getElementById('alertCondition').value;
        const price = parseFloat(document.getElementById('alertPrice').value);

        if (!symbol || !name || !price) {
            alert('Please fill all required fields');
            return;
        }

        try {
            await apiCall('/alert', 'POST', { symbol, name, condition, price });

            await loadAlerts();

            closeModal('alertModal');
            renderTab3();

            // Reset form
            document.getElementById('alertSymbol').value = '';
            document.getElementById('alertName').value = '';
            document.getElementById('alertPrice').value = '';
        } catch (error) {
            alert('Failed to create alert: ' + error.message);
        }
    }

    async function toggleAlert(id, active) {
        try {
            await apiCall(`/alert/${id}`, 'PUT', { active });
            await loadAlerts();
            renderTab3();
        } catch (error) {
            alert('Failed to update alert: ' + error.message);
        }
    }

    async function deleteAlert(id) {
        if (!confirm('确定要删除这个提醒吗？')) return;

        try {
            await apiCall(`/alert/${id}`, 'DELETE');
            await loadAlerts();
            renderTab3();
        } catch (error) {
            alert('Failed to delete alert: ' + error.message);
        }
    }

    function selectStock(stock) {
        APP.selectedStock = stock;
        renderTab1();
    }

    async function exportData() {
        try {
            const data = await apiCall('/export');
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `kxm-data-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        } catch (error) {
            alert('Failed to export data: ' + error.message);
        }
    }

    async function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        try {
            const json = await file.text();
            const data = JSON.parse(json);

            if (!data.holdings || !Array.isArray(data.holdings)) {
                alert('Invalid data format');
                return;
            }

            await apiCall('/import-holdings', 'POST', { holdings: data.holdings });
            await loadHoldings();
            await updatePrices();
            renderTab0();

            alert('Import successful');
        } catch (error) {
            alert('Import failed: ' + error.message);
        }

        event.target.value = '';
    }

    // ============ Init ============
    window.addEventListener('load', async () => {
        if (APP.token) {
            // 验证token是否仍然有效（服务器重启后session会清空）
            try {
                const resp = await fetch(API_BASE + '/verify', {
                    headers: { 'x-token': APP.token }
                });
                const data = await resp.json();
                if (data.valid) {
                    showApp();
                } else {
                    // token无效，清除本地存储，显示登录页
                    localStorage.removeItem('kxm_token');
                    localStorage.removeItem('kxm_user');
                    APP.token = null;
                    APP.username = null;
                    showLogin();
                }
            } catch (e) {
                // 网络错误，显示登录页
                localStorage.removeItem('kxm_token');
                localStorage.removeItem('kxm_user');
                APP.token = null;
                APP.username = null;
                showLogin();
            }
        } else {
            showLogin();
        }
    });
</script>
</body>
</html>
