<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Arc Patrimony - Cloud Version">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Arc Patrimony">
    <meta name="theme-color" content="#0B0F12">
    <title>Arc Patrimony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C1A673;
            --gold-light: #EADDBC;
            --gold-dark: #96845E;
            --gold-glow: rgba(193,166,115,0.15);
            --gold-border: rgba(193,166,115,0.2);
            --gold-border-hover: rgba(193,166,115,0.4);
            --bg-deep: #0B0F12;
            --bg-card: rgba(20,25,32,0.6);
            --font-mono: 'JetBrains Mono', 'SF Mono', ui-monospace, 'Menlo', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Montserrat', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-deep);
            color: #e2e8f0;
            font-variant-numeric: tabular-nums;   /* 全局等宽数字：金额/百分比小数点对齐 */
        }

        #root {
            height: 100%;
        }

        /* ===== Sci-fi Grid Background ===== */
        .app-container::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(193,166,115,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(193,166,115,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }
        .app-container::after {
            content: '';
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(193,166,115,0.05) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(150,132,94,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        .app-container > * { position: relative; z-index: 1; }

        /* ===== Glassmorphism base ===== */
        .glass {
            background: var(--bg-card) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.03);
        }

        /* ===== Breathing glow animation ===== */
        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 8px rgba(193,166,115,0.1), 0 4px 15px rgba(0,0,0,0.2); }
            50% { box-shadow: 0 0 20px rgba(193,166,115,0.2), 0 4px 20px rgba(0,0,0,0.3); }
        }
        @keyframes breatheActive {
            0%, 100% { box-shadow: 0 0 12px rgba(193,166,115,0.3), 0 4px 20px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 28px rgba(234,221,188,0.4), 0 4px 25px rgba(0,0,0,0.4); }
        }

        /* ===== Brand loading screen ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(193,166,115,0.2)); }
            50% { filter: drop-shadow(0 0 20px rgba(234,221,188,0.5)); }
        }
        @keyframes starPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; filter: drop-shadow(0px 0px 8px rgba(234,221,188,0.8)); }
        }
        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-deep);
            background-image:
                linear-gradient(rgba(193,166,115,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(193,166,115,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .login-screen::before {
            content: '';
            position: absolute;
            top: -30%; left: -30%; width: 160%; height: 160%;
            background: radial-gradient(ellipse at 30% 30%, rgba(193,166,115,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 70%, rgba(150,132,94,0.04) 0%, transparent 50%);
            pointer-events: none;
        }

        .login-card {
            background: rgba(20, 25, 32, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--gold-border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(234,221,188,0.03);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        .login-logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 12px;
        }

        .login-brand-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            animation: logoGlow 3s ease-in-out infinite;
        }

        .login-title {
            font-family: 'Cinzel', 'Times New Roman', serif;
            font-size: 26px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #C1A673, #EADDBC, #96845E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
        }

        .login-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 300;
            text-align: center;
            color: var(--gold-dark);
            margin-bottom: 30px;
            letter-spacing: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(11, 15, 18, 0.6);
            border: 1px solid rgba(150,132,94,0.25);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(193,166,115,0.1), 0 0 15px rgba(193,166,115,0.08);
        }

        .form-error {
            color: #f87171;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .form-error.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C1A673, #96845E);
            color: #0B0F12;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #EADDBC, #C1A673);
            box-shadow: 0 4px 20px rgba(193,166,115,0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(30, 35, 40, 0.5);
            border: 1px solid var(--gold-border);
            color: var(--gold-light);
            border-radius: 10px;
        }

        .btn-secondary:hover {
            background: rgba(40, 45, 50, 0.5);
            border-color: var(--gold-border-hover);
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        /* App Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #060b18;
            position: relative;
            overflow: hidden;
        }

        /* Market status light bar */
        .market-light-bar {
            height: 2px;
            background: linear-gradient(90deg, transparent, #4ade80, var(--gold), #4ade80, transparent);
            background-size: 200% 100%;
            animation: lightBarFlow 4s linear infinite;
        }
        .market-light-bar.negative {
            background: linear-gradient(90deg, transparent, #f87171, var(--gold), #f87171, transparent);
            background-size: 200% 100%;
        }
        @keyframes lightBarFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* FX strip — borderless raised bar with seamless looping marquee */
        .fx-strip {
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg,
                rgba(40,55,75,0.55) 0%,
                rgba(20,30,45,0.85) 50%,
                rgba(8,12,18,0.95) 100%);
            border-radius: 10px;
            box-shadow:
                0 8px 22px rgba(0,0,0,0.55),
                0 2px 4px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(193,166,115,0.22),
                inset 0 -2px 4px rgba(0,0,0,0.5);
            cursor: pointer;
            user-select: none;
            padding: 7px 0;
        }
        .fx-strip-label {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 10px;
            color: #C1A673;
            letter-spacing: 2px;
            font-weight: 700;
            background: linear-gradient(90deg,
                rgba(8,12,18,0.98) 0%,
                rgba(8,12,18,0.95) 70%,
                rgba(8,12,18,0) 100%);
            z-index: 2;
            pointer-events: none;
        }
        .fx-strip-track {
            display: flex;
            gap: 10px;
            width: max-content;
            animation: fxStripMarquee 38s linear infinite;
            padding-left: 70px; /* avoid overlap with FX label */
            will-change: transform;
        }
        .fx-strip.paused .fx-strip-track {
            animation-play-state: paused;
        }
        .fx-strip.paused {
            box-shadow:
                0 8px 22px rgba(0,0,0,0.55),
                0 0 0 1px rgba(193,166,115,0.4),
                inset 0 1px 0 rgba(193,166,115,0.3);
        }
        /* one full track = two copies of chips concatenated; -50% loops seamlessly */
        @keyframes fxStripMarquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        /* Apple-style minimalist pill + dropdown */
        .apple-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 11px 6px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        .apple-pill:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(193,166,115,0.3);
        }
        .apple-pill.active {
            background: rgba(193,166,115,0.12);
            border-color: rgba(193,166,115,0.45);
        }
        .apple-pill .chevron {
            font-size: 9px;
            color: #94a3b8;
            transition: transform 0.2s ease;
            margin-left: 1px;
        }
        .apple-pill.active .chevron {
            transform: rotate(180deg);
            color: #C1A673;
        }
        .apple-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 6px;
            background: rgba(22, 30, 42, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 4px;
            box-shadow: 0 10px 32px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
            min-width: 200px;
            z-index: 100;
            animation: appleDropFade 0.15s ease-out;
        }
        @keyframes appleDropFade {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .apple-dropdown-item {
            padding: 8px 12px;
            border-radius: 6px;
            color: #cbd5e1;
            font-size: 12.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
            white-space: nowrap;
        }
        .apple-dropdown-item:hover:not(.disabled) {
            background: rgba(255,255,255,0.06);
        }
        .apple-dropdown-item.selected {
            color: #C1A673;
            background: rgba(193,166,115,0.08);
        }
        .apple-dropdown-item.disabled {
            color: #475569;
            cursor: default;
            font-style: italic;
        }
        .apple-dropdown-item .check {
            margin-left: auto;
            color: #C1A673;
            font-size: 11px;
        }

        .app-header {
            background: rgba(11, 15, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(193,166,115,0.1);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo-mini {
            width: 32px;
            height: 32px;
        }

        .app-title {
            font-family: 'Cinzel', 'Times New Roman', serif;
            font-size: 18px;
            font-weight: 500;
            background: linear-gradient(135deg, #C1A673, #EADDBC, #96845E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        /* SMALTO 风格旗号：11px JetBrains Mono 小尺寸，不放大 */
        .app-flag {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            color: var(--gold-dark);
            margin-top: 2px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .header-user-badge {
            background: rgba(193,166,115,0.1);
            border: 1px solid rgba(193,166,115,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--gold-light);
            font-weight: 400;
            font-size: 13px;
        }

        .btn-logout {
            padding: 7px 14px;
            background: rgba(248,113,113,0.08);
            border: 1px solid rgba(248,113,113,0.2);
            color: #fca5a5;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(248,113,113,0.15);
            border-color: rgba(248,113,113,0.35);
        }

        /* ===== Floating breathing tab buttons ===== */
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(11, 15, 18, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow-x: auto;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(193,166,115,0.06);
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid rgba(193,166,115,0.1);
            border-radius: 12px;
            color: #64748b;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.4s ease;
            background: rgba(20, 25, 32, 0.4);
            position: relative;
            animation: breathe 4s ease-in-out infinite;
        }

        .tab:hover {
            color: var(--gold-light);
            background: rgba(193,166,115,0.06);
            border-color: rgba(193,166,115,0.25);
        }

        .tab.active {
            color: var(--gold-light);
            background: linear-gradient(135deg, rgba(193,166,115,0.15), rgba(193,166,115,0.06));
            border-color: rgba(193,166,115,0.4);
            animation: breatheActive 3s ease-in-out infinite;
        }

        /* "Update" 按钮：与 Settings 同字体同尺寸，仅由前面的小绿图标做区分 */
        .tab.tab-refresh {
            animation: none;                /* 不参与 breathe 呼吸动画 */
        }
        .tab.tab-refresh:hover {
            color: var(--gold-light);
            background: rgba(74,222,128,0.05);
            border-color: rgba(74,222,128,0.28);
        }
        .tab.tab-refresh.is-loading {
            opacity: 0.55;
            pointer-events: none;
        }
        .tab-refresh-icon {
            width: 0.7em;                   /* 比文字小 30% */
            height: 0.7em;
            vertical-align: -0.05em;
            margin-right: 5px;
            display: inline-block;
        }
        .tab.tab-refresh.is-loading .tab-refresh-icon {
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        /* 现金水位键：紧跟 Trades，显示现金占比，点击进管理弹窗（不带 .tab 类，不参与 tab 索引）*/
        .tab-cash {
            padding: 10px 16px;
            cursor: pointer;
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            color: var(--gold);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            background: rgba(20, 25, 32, 0.4);
            transition: all 0.3s ease;
            font-variant-numeric: tabular-nums;
        }
        .tab-cash:hover {
            color: var(--gold-light);
            background: rgba(193,166,115,0.08);
            border-color: var(--gold-border-hover);
        }
        .tab-cash.below {
            color: #f87171;
            border-color: rgba(248,113,113,0.4);
            background: rgba(248,113,113,0.06);
        }

        /* 行情时间戳备注：紧跟刷新按钮，小字淡灰 */
        .prices-updated-note {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            color: #475569;
            padding: 0 4px;
            white-space: nowrap;
            user-select: none;
        }

        .tab-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0B0F12;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        /* Dashboard */
        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Stat grid: 4 equal-width cards.
           Order: Budget · Today P&L · YTD Total P&L · Cumulative P&L. */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .stat-grid .stat-hero { grid-column: span 1; }

        /* Inner 3-cell meta grid inside the hero card (YTD / MV / Cost) */
        .hero-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid rgba(193,166,115,0.12);
        }
        .hero-meta { min-width: 0; }
        .hero-meta-label {
            font-size: 9px;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .hero-meta-value {
            font-size: 13px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            line-height: 1.2;
        }
        .hero-meta-sub {
            font-size: 10px;
            color: #64748b;
            margin-top: 2px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 14px;
            padding: 18px 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(193,166,115,0.4), transparent);
            opacity: 0.6;
        }
        .stat-card:hover {
            border-color: var(--gold-border-hover);
            box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 20px var(--gold-glow);
            transform: translateY(-2px);
        }

        /* Hero card — emphasized */
        .stat-hero {
            background: linear-gradient(135deg, rgba(193,166,115,0.08), rgba(20,25,32,0.7));
            border-color: rgba(193,166,115,0.3);
        }
        .stat-hero::after {
            content: '';
            position: absolute;
            right: -40px; bottom: -40px;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(193,166,115,0.10), transparent 70%);
            pointer-events: none;
        }

        /* Today card with pulsing dot */
        .stat-today.pulse-up { border-color: rgba(74,222,128,0.25); }
        .stat-today.pulse-down { border-color: rgba(248,113,113,0.25); }

        .stat-budget { background: linear-gradient(135deg, rgba(193,166,115,0.05), rgba(20,25,32,0.6)); }

        .stat-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--gold-dark);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        .stat-chip {
            font-size: 9px;
            color: var(--gold-light);
            background: rgba(193,166,115,0.08);
            border: 1px solid rgba(193,166,115,0.25);
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        /* Phase 3 redesign: P&L 卡片"% 大、金额小"的双层值显示 */
        .stat-pnl-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .stat-pct-lg, .stat-amount-sm {
            font-size: 19px;
            font-weight: 500;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -0.3px;
            line-height: 1;
        }
        .stat-amount-sm {
            color: inherit;  /* 跟 % 同色（涨绿跌红） */
        }
        @media (max-width: 768px) {
            .stat-pct-lg, .stat-amount-sm { font-size: 17px; }
        }
        @media (max-width: 480px) {
            .stat-pct-lg, .stat-amount-sm { font-size: 15px; }
        }

        .stat-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .stat-dot.dot-up {
            background: #4ade80;
            box-shadow: 0 0 8px #4ade80;
            animation: dotPulse 2s ease-in-out infinite;
        }
        .stat-dot.dot-down {
            background: #f87171;
            box-shadow: 0 0 8px #f87171;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.6; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--gold-light);
        }
        .stat-value-xl {
            font-size: 32px;
            font-weight: 700;
            color: #f1f5f9;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -0.5px;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .stat-value-lg {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-light);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: -0.3px;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .stat-sub {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .budget-bar-wrap {
            background: rgba(15,23,42,0.7);
            border: 1px solid rgba(193,166,115,0.30);  /* 线框：让"未使用预算"轨道清晰可见 */
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin: 8px 0 6px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
        }
        .budget-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .stat-change {
            font-size: 13px;
            color: #4ade80;
            margin-top: 5px;
        }

        .stat-change.negative {
            color: #f87171;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .chart-card:hover {
            border-color: var(--gold-border-hover);
        }

        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .holdings-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.4);
            border: none;
        }

        .holdings-table thead {
            background: rgba(6, 11, 24, 0.8);
            border-bottom: 1px solid rgba(99,102,241,0.1);
        }

        .holdings-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: sticky;
            top: 0;
            background: rgba(6, 11, 24, 0.95);
            z-index: 10;
            white-space: nowrap;
        }

        .holdings-table td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            white-space: nowrap;
        }

        .holdings-table tbody tr:last-child td {
            border-bottom: none;
        }

        .holdings-table tbody tr:hover {
            background: rgba(193, 166, 115, 0.04);
        }

        .symbol-cell {
            font-weight: 600;
            color: var(--gold);
            font-family: var(--font-mono);
            letter-spacing: 0.3px;
        }

        /* 名字列水平滚动时锁定在最左侧（手机/PAD 横向滚动看右侧数据时仍能看到是哪只股） */
        .holdings-table .sticky-name-col {
            position: sticky;
            left: 0;
            z-index: 4;
            background: #0e1419;                  /* 实色，避免后面列透出来叠在 Name 上 */
            box-shadow: 6px 0 8px -6px rgba(0,0,0,0.65);   /* 右侧投影提示该列被钉住 */
            padding-left: 12px;                    /* 缩窄左右内边距以多容下 1~2 个中文字 */
            padding-right: 6px;
        }
        .holdings-table thead .sticky-name-col {
            z-index: 11;                            /* 高于 thead 默认 z-index 10 */
            background: rgba(6, 11, 24, 1);         /* thead 实色版本 */
        }
        .holdings-table tbody tr:hover .sticky-name-col {
            background: #181f2b;                    /* 跟随 hover 高亮 */
        }

        /* ===== 地区抽屉「持仓清单」表：纵向锁表头 + 横向锁前两列(占比/名称) ===== */
        .dd-scroll {
            overflow: auto;
            max-height: 62vh;
            -webkit-overflow-scrolling: touch;
        }
        .dd-table thead th {                        /* 下滑：锁表头 */
            position: sticky;
            top: 0;
            z-index: 3;
            background: #0f1622;
        }
        .dd-table th:nth-child(1), .dd-table td:nth-child(1) {   /* 右滑：锁「占比%」列 */
            position: sticky;
            left: 0;
            z-index: 2;
            background: #0e1419;
            width: 78px;
            min-width: 78px;
            max-width: 78px;
        }
        .dd-table th:nth-child(2), .dd-table td:nth-child(2) {   /* 右滑：锁「名称」列 */
            position: sticky;
            left: 78px;
            z-index: 2;
            background: #0e1419;
            box-shadow: 6px 0 8px -6px rgba(0,0,0,0.65);   /* 右缘投影提示该列被钉住 */
        }
        .dd-table thead th:nth-child(1),
        .dd-table thead th:nth-child(2) {           /* 左上角：同时锁行列，层级最高 */
            z-index: 5;
            background: #0f1622;
        }
        .dd-name {                                  /* 名称：超长截断省略号，完整名在 title */
            display: inline-block;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }
        @media (max-width: 768px) {
            .dd-name { max-width: 4.2em; }          /* 手机：约 4 个汉字宽 */
        }

        .region-badge {
            display: inline-block;
            background: rgba(193,166,115,0.08);
            border: 1px solid rgba(193,166,115,0.15);
            color: var(--gold-light);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
        }

        .price-positive {
            color: #4ade80;
        }

        .price-negative {
            color: #f87171;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .empty-text {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Search and Stock Cards */
        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--gold-border);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold-border-hover);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .stock-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .stock-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(193,166,115,0.12);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .stock-card:hover {
            border-color: var(--gold-border-hover);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(99, 102, 241, 0.15);
            transform: translateY(-2px);
        }

        .stock-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .stock-card-symbol {
            font-weight: 600;
            color: var(--gold);
            font-size: 16px;
        }

        .stock-card-change {
            font-size: 14px;
            font-weight: 600;
        }

        .stock-card-name {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .stock-card-price {
            font-size: 18px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .stock-detail-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stock-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .stock-detail-info h2 {
            font-size: 20px;
            color: #e2e8f0;
            margin-bottom: 5px;
        }

        .stock-detail-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        .stock-detail-price {
            text-align: right;
        }

        .stock-detail-price-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--gold-light);
        }

        .stock-detail-chart canvas {
            width: 100%;
            height: 200px;
        }

        /* Trade Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 0.3s ease-out;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        /* Phase 3.6: 股票输入框自动补全（支持代码或中文名搜索）*/
        .symbol-autocomplete-wrap {
            position: relative;
        }
        .symbol-autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 8px;
            margin-top: 4px;
            max-height: 260px;
            overflow-y: auto;
            z-index: 1100;
            display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .symbol-autocomplete-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(148,163,184,0.08);
            transition: background 0.12s;
        }
        .symbol-autocomplete-item:last-child { border-bottom: none; }
        .symbol-autocomplete-item:hover, .symbol-autocomplete-item.active {
            background: rgba(193,166,115,0.14);
        }
        .symbol-autocomplete-item .ac-sym {
            font-family: Montserrat, sans-serif;
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 500;
            min-width: 80px;
        }
        .symbol-autocomplete-item .ac-name {
            font-size: 12px;
            color: #94a3b8;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .symbol-autocomplete-item .ac-region {
            font-size: 10px;
            color: #64748b;
            white-space: nowrap;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
        }

        /* ===== Trade Action Picker (3-card step 1) ===== */
        .trade-action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }
        .trade-action-card {
            background: rgba(20,25,32,0.5);
            border: 1.5px solid rgba(193,166,115,0.18);
            border-radius: 12px;
            padding: 18px 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .trade-action-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(193,166,115,0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .trade-action-card:hover::before { opacity: 1; }
        .trade-action-card:hover {
            border-color: rgba(193,166,115,0.5);
            background: rgba(193,166,115,0.06);
            transform: translateY(-2px);
        }
        .trade-action-card.active {
            border-color: #C1A673;
            background: linear-gradient(135deg, rgba(193,166,115,0.18), rgba(193,166,115,0.04));
            box-shadow: 0 0 24px rgba(193,166,115,0.25), inset 0 1px 0 rgba(234,221,188,0.1);
        }
        .trade-action-card.active::before { opacity: 1; }
        .trade-action-icon {
            font-size: 26px;
            line-height: 1;
            margin-bottom: 8px;
            filter: grayscale(0.3);
            transition: filter 0.25s;
        }
        .trade-action-card.active .trade-action-icon { filter: grayscale(0); }
        .trade-action-en {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-light);
        }
        .trade-action-zh {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Quick-pick chips for selecting from existing holdings */
        .holding-pick-chip {
            font-size: 11px;
            padding: 5px 11px;
            background: rgba(193,166,115,0.06);
            border: 1px solid rgba(193,166,115,0.2);
            color: var(--gold);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Montserrat', sans-serif;
        }
        .holding-pick-chip:hover {
            background: rgba(193,166,115,0.15);
            border-color: var(--gold);
            color: var(--gold-light);
        }
        .holding-pick-chip.selected {
            background: var(--gold);
            color: #0B0F12;
            border-color: var(--gold);
        }

        /* Mobile-friendly: trade action grid stacks 3 columns but smaller */
        @media (max-width: 480px) {
            .trade-action-grid { gap: 6px; }
            .trade-action-card { padding: 14px 6px; }
            .trade-action-icon { font-size: 22px; }
            .trade-action-en { font-size: 10px; letter-spacing: 1px; }
            .trade-action-zh { font-size: 10px; }
        }

        /* Alert Cards */
        .alert-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .alert-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(193,166,115,0.12);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
        }
        .alert-card:hover {
            border-color: var(--gold-border-hover);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .alert-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .alert-card-symbol {
            font-weight: 600;
            color: var(--gold);
            font-size: 14px;
        }

        .alert-card-close {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }

        .alert-card-condition {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .alert-card-price {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 12px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background-color: #334155;
            border-radius: 13px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .toggle-switch.active {
            background-color: #4ade80;
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            transition: left 0.2s;
        }

        .toggle-switch.active .toggle-slider {
            left: 27px;
        }

        /* Trade Table */
        .trades-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.4);
            border: none;
        }

        .trades-table thead {
            background: rgba(6, 11, 24, 0.8);
            border-bottom: 1px solid rgba(99,102,241,0.1);
        }

        .trades-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
            position: sticky;          /* 滚动时表头固定（含手机端） */
            top: 0;
            background: rgba(6, 11, 24, 0.95);
            z-index: 10;
        }

        .trades-table td {
            padding: 12px 16px;
            font-size: 13px;
            border-bottom: 1px solid rgba(51,65,85,0.3);
            white-space: nowrap;
        }

        .trades-table tbody tr:last-child td {
            border-bottom: none;
        }

        .trades-table tbody tr:hover {
            background: rgba(99,102,241,0.06);
        }

        .trade-type-buy {
            color: #4ade80;
        }

        .trade-type-sell {
            color: #f87171;
        }

        .trade-type-dividend {
            color: #fbbf24;
        }

        /* FX Rates */
        .fx-rates {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .fx-rate {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(193,166,115,0.12);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .fx-rate-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .fx-rate-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold-light);
        }

        /* Data Management */
        .data-management {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .data-section {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid var(--gold-border);
            border-radius: 12px;
            padding: 16px 18px;
        }

        .data-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--gold-dark);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            display: flex;

        /* Phase 3 redesign: compact stats row inside User Info */

        /* Phase 3 redesign: 2-col grid for top settings row */

        }

        }

        /* Phase 3 redesign: smaller, consistent action buttons */
        .btn-action {
            background: rgba(193,166,115,0.12);
            color: var(--gold-light);
            border: 1px solid rgba(193,166,115,0.4);

        .btn-action.primary {
            background: var(--gold-light);
            color: #0f172a;
            font-weight: 600;
        }
        .btn-action.primary:hover {
            background: #d4b87a;
        }

        /* Phase 3 redesign: source legend chips */
        .src-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
        }
        .src-legend-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(15,23,42,0.5);

        .src-legend-chip .badge {

            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;

        }

        /* Phase 3 极简风：Apple iOS Settings 式列表 */
        .apple-id-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;

            border: 1px solid var(--gold-border);

        }
        .apple-id-avatar {

        .apple-id-info { flex: 1; min-width: 0; }

        .apple-section-label {

        .apple-list {

        /* Phase 3 redesign: data row inside section (label + action) — DEPRECATED, kept for compat */

            display: flex;
            justify-content: space-between;

        .settings-row-info .title {

        #importFile {

        .loading {
            display: inline-block;

        @keyframes spin {
            to { transform: rotate(360deg); }

        /* ============ Responsive: Desktop / Tablet / Mobile ============ */

        /* Tablet: 641px – 1024px (iPad portrait/landscape) */
        @media (max-width: 1024px) {
            .stat-grid {
                /* Hero on top spanning full width, other 2 cards share second row */

            }

            .stat-value-xl { font-size: 28px; }
            .stat-value-lg { font-size: 20px; }

            .tab-content { padding: 16px; }
            .charts-row { grid-template-columns: 1fr; }

            .trades-table th, .trades-table td { padding: 9px 8px; }

            .app-header { padding: 10px 16px; }
            .app-title { font-size: 16px; letter-spacing: 2px; }
        }

        /* Mobile: ≤640px (phones) */
        @media (max-width: 640px) {
            .stat-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 18px;
            }
            .stat-grid .stat-hero { grid-column: span 1; }
            /* Mobile reorder (LiuBin 2026-04-29): Today > YTD > Cumulative > Budget */
            .stat-grid .stat-today      { order: 1; }
            .stat-grid .stat-ytd        { order: 2; }
            .stat-grid .stat-cumulative { order: 3; }
            .stat-grid .stat-budget     { order: 4; }
            .stat-card { padding: 14px 16px; border-radius: 12px; }
            .stat-value-xl { font-size: 26px; }
            .stat-value-lg { font-size: 18px; }
            .stat-label { font-size: 9px; letter-spacing: 1.2px; }
            .stat-sub { font-size: 11px; }
            .hero-meta-grid { grid-template-columns: 1fr; gap: 8px; padding-top: 10px; }
            .hero-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
            .hero-meta-label { margin-bottom: 0; flex-shrink: 0; }
            .hero-meta-sub { margin-top: 0; font-size: 10px; }

            /* Tabs: compact + scrollable */
            .tabs {
                padding: 8px 12px;
                gap: 6px;
                -webkit-overflow-scrolling: touch;
            }
            .tab, .tab-cash {
                padding: 7px 12px;
                font-size: 12px;
                border-radius: 10px;
            }

            .tab-content { padding: 12px; }

            /* Header collapses */
            .app-header { padding: 10px 14px; }
            .app-logo-mini { width: 26px; height: 26px; }
            .app-title { font-size: 14px; letter-spacing: 1.5px; }
            .header-user-badge { padding: 4px 10px; font-size: 11px; }
            .btn-logout { padding: 5px 10px; font-size: 11px; }

            /* Layout */
            .charts-row { grid-template-columns: 1fr; gap: 14px; }
            .stock-cards { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .data-buttons { flex-direction: column; }
            .modal-content { padding: 20px 16px; max-height: 92vh; border-radius: 14px; }
            .modal { padding: 10px; }

            /* Tables: smaller font; horizontal scroll inside chart-card */
            .holdings-table, .trades-table { font-size: 11px; }
            .holdings-table th, .holdings-table td,
            .trades-table th, .trades-table td { padding: 7px 6px; }
            .chart-card { padding: 14px 14px; border-radius: 12px; }

            /* FX rates compact */
            .fx-rates { grid-template-columns: 1fr; gap: 8px; }
            .fx-rate { padding: 10px; }
            .fx-rate-value { font-size: 14px; }

            /* Login screen tighter */
            .login-card { padding: 28px 22px; }
            .login-brand-icon { width: 80px; height: 80px; margin-bottom: 12px; }
            .login-title { font-size: 22px; letter-spacing: 4px; }
        }

        /* Small phones: ≤380px */
        @media (max-width: 380px) {
            .stat-value-xl { font-size: 22px; }
            .stat-value-lg { font-size: 16px; }
            .app-title { font-size: 12px; letter-spacing: 1px; }
            .header-user-badge { font-size: 10px; padding: 3px 8px; }
        }

        /* ============ Foldable phones ============ */

        /* Z Flip closed / Z Fold cover screen / very narrow ≤320px */
        @media (max-width: 320px) {
            .login-card { padding: 22px 16px; }
            .login-brand-icon { width: 64px; height: 64px; margin-bottom: 8px; }
            .login-title { font-size: 17px; letter-spacing: 2px; }
            .login-subtitle { font-size: 9px; letter-spacing: 3px; margin-bottom: 18px; }
            .button-group { flex-direction: column; gap: 8px; }
            .button-group button { width: 100%; }
            .form-input { padding: 10px 12px; font-size: 13px; }

            .app-header { padding: 8px 10px; }
            .app-logo-mini { width: 22px; height: 22px; }
            .app-title { font-size: 11px; letter-spacing: 0.5px; }
            .header-user-badge { font-size: 9px; padding: 2px 6px; }
            .btn-logout { font-size: 10px; padding: 4px 8px; }

            .tabs { padding: 6px 8px; gap: 4px; }
            .tab, .tab-cash { padding: 6px 9px; font-size: 11px; border-radius: 8px; }
            .tab-content { padding: 10px; }

            .stat-card { padding: 12px 14px; border-radius: 10px; }
            .stat-value-xl { font-size: 19px; }
            .stat-value-lg { font-size: 15px; }
            .stat-label { font-size: 9px; letter-spacing: 1px; }
            .stat-sub { font-size: 10px; }

            .chart-card { padding: 12px 12px; border-radius: 10px; }
            .chart-title { font-size: 12px; }

            .modal { padding: 8px; }
            .modal-content { padding: 18px 14px; border-radius: 12px; }
            .modal-header { font-size: 16px; }

            .trade-action-grid { gap: 4px; margin-bottom: 16px; }
            .trade-action-card { padding: 10px 4px; border-radius: 9px; }
            .trade-action-icon { font-size: 18px; margin-bottom: 4px; }
            .trade-action-en { font-size: 9px; letter-spacing: 0.5px; }
            .trade-action-zh { font-size: 9px; }

            .holdings-table th, .holdings-table td,
            .trades-table th, .trades-table td { padding: 5px 4px; font-size: 10px; }
        }

        /* Z Fold inner screen ~717x738 (square-ish, wide enough but short) and similar
           — wide enough to be "tablet-like" but aspect is unusual */
        @media (min-width: 600px) and (max-width: 900px) and (max-aspect-ratio: 5/4) {
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-grid .stat-hero { grid-column: span 2; }
            .stat-value-xl { font-size: 24px; }
            .stat-value-lg { font-size: 18px; }

            /* Use vertical real estate instead of horizontal */
            .charts-row { grid-template-columns: 1fr; }
            .tab-content { padding: 14px; }

            /* Modal narrower so it doesn't span the fold */
            .modal-content { max-width: 92vw; }
        }

        /* True foldable detection — CSS Viewport Segments API.
           Browsers that support it (Chrome on dual-screen / Edge) get this; others fall back. */
        @media (horizontal-viewport-segments: 2) {
            /* Layout uses left segment for primary content, right for secondary
               Using env() variables for segment widths */
            .stat-grid {
                grid-template-columns:
                    calc(env(viewport-segment-width 0 0, 50%))
                    calc(env(viewport-segment-width 1 0, 50%));
                column-gap: env(viewport-segment-left 1 0, 16px);
            }
            .stat-grid .stat-hero { grid-column: 1 / -1; }
            /* Push modal to one segment so the hinge doesn't cut form fields */
            .modal-content { max-width: env(viewport-segment-width 0 0, 92vw); }
            .charts-row {
                grid-template-columns:
                    calc(env(viewport-segment-width 0 0, 50%))
                    calc(env(viewport-segment-width 1 0, 50%));
                column-gap: env(viewport-segment-left 1 0, 16px);
            }
        }
        @media (vertical-viewport-segments: 2) {
            /* Stacked horizontal fold (book mode): top segment for header/stats, bottom for content */
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .stat-grid .stat-hero { grid-column: span 2; }
        }

        /* Fallback: legacy "spanning" CSS spec (Surface Duo old prefix) */
        @media (spanning: single-fold-vertical) {
            .stat-grid { grid-template-columns: 1fr 1fr; }
            .stat-grid .stat-hero { grid-column: span 2; }
        }

        /* Utility */
        .mt-20 {
            margin-top: 20px;
        }

        .text-center {
            text-align: center;
        }

        .text-sm {
            font-size: 12px;
        }

        .text-muted {
            color: #94a3b8;
        }

        .nowrap {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ============ State Management ============
    const APP = {
        token: localStorage.getItem('kxm_token'),
        username: localStorage.getItem('kxm_user'),
        prices: {},
        priceUpdateInterval: null,
        holdings: [],
        trades: [],
        alerts: [],
        cash: { positions: [], total_usd: 0, red_line_pct: 20 },
        selectedStock: null,
        isRegister: false,
        regionFilter: '全部',
        currencyFilter: '全部',
        holdingsSort: { key: null, dir: 'desc' },
        portfolioBudget: 0,
        regionBudgets: {},
        FX_RATES: {
            'JPY': 0.0067,
            'CNY': 0.138,
            'USD': 1,
            'HKD': 0.128,
            'default': 1
        }
    };

    const API_BASE = '/api';

    // ============ Utility Functions ============
    async function apiCall(endpoint, method = 'GET', body = null, isAuthorized = true) {
        const options = {
            method,
            headers: {
                'Content-Type': 'application/json'
            }
        };

        if (isAuthorized && APP.token) {
            options.headers['x-token'] = APP.token;
        }

        if (body) {
            options.body = JSON.stringify(body);
        }

        try {
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            if (response.status === 401 && isAuthorized) {
                // Session expired (server restart wiped sessions, etc.) — force re-login
                console.warn('Session expired, redirecting to login');
                localStorage.removeItem('kxm_token');
                localStorage.removeItem('kxm_user');
                APP.token = null;
                APP.username = null;
                if (APP.priceUpdateInterval) clearInterval(APP.priceUpdateInterval);
                if (APP._fxInterval) clearInterval(APP._fxInterval);
                alert('登录已过期，请重新登录 / Session expired, please sign in again.');
                showLogin();
                throw new Error('Session expired');
            }
            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error('API call failed:', error);
            throw error;
        }
    }

    function fmtNum(value, decimals = 2) {
        return Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    // ============ Per-Market Session Date Helpers (cross-timezone "today" matching) ============
    // 用于 Today P&L 仅计入"市场本地今日"的股票，避免把美股 Tue 收盘混进 Beijing Wed 的"今日"

    // 推断股票所在交易所的 IANA 时区
    function getStockTimezone(holding, priceData) {
        // Yahoo 返回的 exchangeTimezoneName 最准
        if (priceData?.exchangeTimezoneName) return priceData.exchangeTimezoneName;
        // Fallback 按币种 / symbol 后缀
        const sym = (holding.symbol || '').toUpperCase();
        const cur = holding.currency;
        if (sym.endsWith('.HK')) return 'Asia/Hong_Kong';
        if (sym.endsWith('.SS') || sym.endsWith('.SZ')) return 'Asia/Shanghai';
        if (sym.endsWith('.T')) return 'Asia/Tokyo';
        if (cur === 'HKD') return 'Asia/Hong_Kong';
        if (cur === 'CNY') return 'Asia/Shanghai';
        if (cur === 'JPY') return 'Asia/Tokyo';
        return 'America/New_York'; // USD 默认
    }

    // 把 Date 对象按 IANA 时区格式化为 YYYY-MM-DD
    function dateInTZ(date, tz) {
        try {
            return new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' })
                .format(date);
        } catch(e) {
            return date.toISOString().slice(0, 10);
        }
    }

    // 用户当前的"今日"日期（按浏览器本地时区，约等于用户身在地区）
    function getUserTodayDate() {
        const userTZ = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'Asia/Shanghai';
        return dateInTZ(new Date(), userTZ);
    }

    // 把一只股票分到具体的"子市场"（A股/港股/中概/日股/美股），用于 pending 区精细标识
    // 因为 region='中国' 同时包含 A股、港股、中概，全标 🇨🇳 会让人困惑
    function getMarketFlag(h) {
        const sym = (h.symbol || '').toUpperCase();
        const cur = h.currency;
        if (cur === 'HKD' || sym.endsWith('.HK'))                           return { key: '香港',   flag: '🇭🇰', label: '港股' };
        if (cur === 'JPY' || sym.endsWith('.T'))                            return { key: '日本',   flag: '🇯🇵', label: '日股' };
        if (cur === 'CNY' || sym.endsWith('.SS') || sym.endsWith('.SZ'))    return { key: '中国A股',flag: '🇨🇳', label: 'A股' };
        if (h.region === '中国' && cur === 'USD')                            return { key: '中概',   flag: '🇨🇳', label: '中概' };
        return { key: '美国', flag: '🇺🇸', label: '美股' };
    }

    // 该股票现在是否处于"今日常规交易时段"内（基于 Yahoo currentTradingPeriod.regular）
    // true = 今日市场已开盘且未收盘，可能 Yahoo 的 regularMarketTime 还没更新，但市场是 live 的
    function isMarketOpenNow(priceData) {
        const start = priceData?.todaySessionStart || 0;
        const end   = priceData?.todaySessionEnd   || 0;
        if (!start || !end) return false;
        const nowSec = Math.floor(Date.now() / 1000);
        return nowSec >= start && nowSec <= end;
    }

    // 一只股票最近交易会话所属的本地日期（市场时区）
    // 注意：只用真实的 regularMarketTime，不要伪造"今天"，否则会把上一交易日的涨跌错误归到今天。
    function getStockSessionDate(holding, priceData) {
        const tz = getStockTimezone(holding, priceData);
        const ts = priceData?.regularMarketTime;
        if (ts && ts > 0) {
            return dateInTZ(new Date(ts * 1000), tz);
        }
        return dateInTZ(new Date(), tz);
    }

    // 这只股票的"最近交易日"是否就是用户的"今日"（同一天才计入今日盈亏）
    function isStockSessionToday(holding, priceData) {
        const userToday = getUserTodayDate();
        const stockToday = getStockSessionDate(holding, priceData);
        return userToday === stockToday;
    }

    function formatCurrency(value, currency = 'USD') {
        const rate = APP.FX_RATES[currency] || APP.FX_RATES.default;
        const converted = value * rate;
        const symbol = currency === 'USD' ? '$' : currency === 'CNY' ? '¥' : currency;
        return `${symbol}${fmtNum(converted)}`;
    }

    function formatPercent(value) {
        const sign = value >= 0 ? '+' : '';
        return `${sign}${value.toFixed(2)}%`;
    }

    function getRegionColor(region) {
        const colors = {
            'US': '#C1A673',
            'HK': '#4ade80',
            'JP': '#f87171',
            'CN': '#fbbf24'
        };
        return colors[region] || '#64748b';
    }

    // ============ Canvas Chart Functions ============
    function drawPie(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !data || data.length === 0) return;
        try { _drawPieInner(canvas, data); } catch(e) { console.warn('drawPie error:', e.message); }
    }
    function _drawPieInner(canvas, data) {

        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.max(Math.min(centerX, centerY) - 20, 30);
        const innerRadius = radius * 0.6;

        let currentAngle = -Math.PI / 2;
        const total = data.reduce((sum, d) => sum + d.value, 0);

        data.forEach(item => {
            const sliceAngle = (item.value / total) * 2 * Math.PI;

            // Draw slice
            ctx.fillStyle = item.color;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
            ctx.lineTo(centerX + innerRadius * Math.cos(currentAngle + sliceAngle / 2),
                       centerY + innerRadius * Math.sin(currentAngle + sliceAngle / 2));
            ctx.arc(centerX, centerY, innerRadius, currentAngle + sliceAngle, currentAngle, true);
            ctx.closePath();
            ctx.fill();

            currentAngle += sliceAngle;
        });

        // Draw center text
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`$${Number(total.toFixed(0)).toLocaleString('en-US')}`, centerX, centerY);
    }

    function drawLine(canvasId, data, color = '#C1A673') {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const padding = 40;
        const width = canvas.width - padding * 2;
        const height = canvas.height - padding * 2;

        const values = data.map(d => d.v);
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const range = maxVal - minVal || 1;

        // Draw gradient
        const gradient = ctx.createLinearGradient(0, padding, 0, padding + height);
        gradient.addColorStop(0, color + '40');
        gradient.addColorStop(1, color + '00');

        // Draw line
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();

        data.forEach((point, i) => {
            const x = padding + (i / (data.length - 1)) * width;
            const y = padding + height - ((point.v - minVal) / range) * height;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });

        ctx.stroke();

        // Fill area under curve
        ctx.lineTo(padding + width, padding + height);
        ctx.lineTo(padding, padding + height);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        // Draw grid lines
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = padding + (height / 4) * i;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(padding + width, y);
            ctx.stroke();
        }

        // Draw axes
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, padding + height);
        ctx.lineTo(padding + width, padding + height);
        ctx.stroke();
    }

    function drawBar(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !data || data.length === 0) return;
        try {

        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const padding = 40;
        const width = canvas.width - padding * 2;
        const height = canvas.height - padding * 2;

        const values = data.map(d => d.value);
        const minVal = Math.min(...values, 0);
        const maxVal = Math.max(...values);
        const range = maxVal - minVal || 1;

        const barWidth = width / data.length * 0.6;
        const barGap = width / data.length;

        data.forEach((item, i) => {
            const x = padding + (i + 0.2) * barGap;
            const barHeight = (item.value - minVal) / range * height;
            const y = padding + height - barHeight;

            ctx.fillStyle = item.value >= 0 ? '#4ade80' : '#f87171';
            ctx.fillRect(x, Math.min(y, padding + height), barWidth, Math.abs(barHeight));

            // Label
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(item.label, x + barWidth / 2, padding + height + 20);
        });

        // Axes
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, padding + height);
        ctx.lineTo(padding + width, padding + height);
        ctx.stroke();

        // Zero line
        const zeroY = padding + height - ((0 - minVal) / range) * height;
        ctx.strokeStyle = '#334155';
        ctx.beginPath();
        ctx.moveTo(padding, zeroY);
        ctx.lineTo(padding + width, zeroY);
        ctx.stroke();
        } catch(e) { console.warn('drawBar error:', e.message); }
    }

    function drawHBar(canvasId, data) {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !data || data.length === 0) return;
        try {

        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;

        const padding = 100;
        const width = canvas.width - padding - 20;
        const height = canvas.height - padding;
        const barHeight = Math.max(20, height / data.length);

        const values = data.map(d => d.value);
        const maxVal = Math.max(...values);

        data.forEach((item, i) => {
            const y = padding + i * barHeight;
            const barWidth = (item.value / maxVal) * width;

            ctx.fillStyle = item.color || '#C1A673';
            ctx.fillRect(padding, y, barWidth, barHeight - 5);

            // Label
            ctx.fillStyle = '#cbd5e1';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(item.label, padding - 10, y + barHeight / 2);

            // Value
            ctx.fillStyle = '#94a3b8';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(item.value.toFixed(2), padding + barWidth + 5, y + barHeight / 2);
        });
        } catch(e) { console.warn('drawHBar error:', e.message); }
    }

    async function handleLogin() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');

        if (!username || !password) {
            errorEl.textContent = 'Please enter username and password';
            errorEl.classList.add('show');
            return;
        }

        try {
            const endpoint = APP.isRegister ? '/register' : '/login';
            const data = await apiCall(endpoint, 'POST', { username, password }, false);

            APP.token = data.token;
            APP.username = data.username;
            localStorage.setItem('kxm_token', data.token);
            localStorage.setItem('kxm_user', data.username);

            showApp();
        } catch (error) {
            errorEl.textContent = APP.isRegister ? 'Registration failed, username may already exist' : 'Sign in failed, invalid username or password';
            errorEl.classList.add('show');
        }
    }

    function handleLogout() {
        localStorage.removeItem('kxm_token');
        localStorage.removeItem('kxm_user');
        APP.token = null;
        APP.username = null;
        APP.isRegister = false;
        if (APP.priceUpdateInterval) clearInterval(APP.priceUpdateInterval);

        const mn = Math.floor(sec / 60);

            APP.portfolioBudget = config.totalBudget || 0;
            // Load per-region budgets (USD conversion uses real-time FX, intentionally fluctuates)
            APP.regionBudgets = {};
            Object.keys(config).forEach(k => {
                if (k.startsWith('budget_') && !k.endsWith('_fx') && k !== 'totalBudget') {
                    APP.regionBudgets[k.replace('budget_', '')] = parseFloat(config[k]) || 0;
                }
            });

        if (APP.priceUpdateInterval) clearInterval(APP.priceUpdateInterval);

            await updatePrices();
            updateCashTabBtn();
            // Re-render current active tab with latest prices
            const activeIdx = document.querySelector('.tab.active');
            if (activeIdx) {
                const tabs = document.querySelectorAll('.tab');
                const idx = Array.from(tabs).indexOf(activeIdx);
                if (idx === 0) renderTab0();
                else if (idx === 1) renderTab1();
                else if (idx === 4) renderTab4();
            }
            // 如果弹窗当前是打开的（如"今日浮盈亏个股明细"），也一并刷新内部数据
            const todayModal = document.getElementById('todayPLModal');

                try { renderRegionDrilldown && renderRegionDrilldown(); } catch(e) {}
            }
            // 顶部"行情更新于"标签自动跟新
            const lbl = document.getElementById('pricesUpdatedLabel');
            if (lbl) lbl.textContent = fmtUpdatedAgo();

        }, 10 * 60 * 1000);
